<form [formGroup]="form" class="dialog-content-wrapper">
    <div class="dialog-header">
        <h2 mat-dialog-title>{{title}}</h2>
        <div class="space1"></div>
        <div mat-button mat-icon-button (click)="dialogRef.close()">
            <mat-icon class="mat-18">clear</mat-icon>
        </div>
    </div>
    <mat-dialog-content class="form-wrapper">
        <div class="error" *ngIf="error">{{error |removeFirebaseText}}</div>
        <div class="form-group">
            <mat-form-field appearance="outline" class="lh-normal">
                <mat-label>
                    អត្តលេខ​
                </mat-label>
                <input matInput required placeholder="អត្តលេខ​" formControlName="email">
                <mat-error *ngIf="form.controls['email'].hasError('required')">
                    ប្រអប់នេះតម្រូវឲ្យលោកអ្នកបញ្ចូលព័ត៌មាន
                </mat-error>
            </mat-form-field>
        </div>
        <div class="form-group">
            <mat-form-field appearance="outline" class="lh-normal">
                <mat-label>ពាក្យសម្ងាត់</mat-label>
                <input matInput type="password" required placeholder="ពាក្យសម្ងាត់" formControlName="password">
                <mat-error *ngIf="form.controls['password'].hasError('required')">
                    ប្រអប់នេះតម្រូវឲ្យលោកអ្នកបញ្ចូលព័ត៌មាន
                </mat-error>
            </mat-form-field>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <div class="flex1"></div>
        <a mat-button mat-dialog-close class="cancel-btn" style="height:42px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            font-weight: 600;">បោះបង់</a>
        <app-primary-button style="margin-left: 6px;" class="primary-button-fill" (onPress)="_onSignIn(form?.value)"
            [process]="process" label="ចូលប្រព័ន្ធ">
        </app-primary-button>
    </mat-dialog-actions>
</form>
