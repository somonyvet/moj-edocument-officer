<div class="rows">

    <button mat-button mat-icon-button (click)="onNoClick()">
        <mat-icon>close</mat-icon>

</div>
<div mat-dialog-content>

        <a mat-list-item *ngFor="let item of store?.config?.contactSupports">

    </mat-nav-list>
</div>
