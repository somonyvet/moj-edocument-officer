<button [id]="btnId" [disabled]="process || disable" mat-button class="mat-puc" [type]="btnType || 'submit'"
  [ngClass]="css || class" (click)="_onPress()">
  <div class="puc-primary">
    @if (img) {
      <img [src]="img">
    }
    <div class="flex1 rows">
      @if (process) {
        <mat-spinner></mat-spinner>
      }
      <span>{{label}}{{process?'...':''}}</span>
    </div>
  </div>
</button>
