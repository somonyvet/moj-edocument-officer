<div class="apply-form-page offi">
  <div class="eform small">
    <div class="header-ef">
      <h2 style="margin-bottom:12px;">ផ្ដល់និទ្ទេសលើពាក្យស្នើសុំព្រឹត្តិបត្រថ្កោលទោស</h2>
      <p style="margin-bottom:12px;">លោកអ្នកត្រូវតែត្រួតពិនិត្យ លើព័ត៌មានសំណើសុំព្រឹត្តិបត្រ ប្រវត្តិរូបសង្ខេប
      និងឯកសារភ្ជាប់មកជាមួយអោយបានត្រឹមត្រូវ</p>
      <div class="lottie-box">
        <ng-lottie [options]="lottie" width="100%" height="100%"></ng-lottie>
      </div>
    </div>
    <ul class="required-items">
      @for (item of decree_options; track item) {
        <li>
          <button mat-button class="ef-item" (click)="_onSubmit(item)">
            <span class="ef-txt">
              <div class="ef-t">
                {{item?.name}}
              </div>
              @if (process && _result?.key===item?.key) {
                <mat-progress-spinner class="small-spinner"  mode="indeterminate">
                </mat-progress-spinner>
              }
            </span>
            <mat-icon>chevron_right</mat-icon>
          </button>
        </li>
      }
    </ul>
  </div>
</div>
