<div class="dialog-wrapper">
  <div class="dialog-header">
    <div class="title">
      {{msg?.title}}
    </div>
    <div class="flex1"></div>
    <a mat-dialog-close class="close-dialog" (click)="onClose('no')">
      <i class="material-icons">&#xE14C;</i>
    </a>
  </div>
  <div class="dialog-content">
    <div class="form-content" style="align-items: flex-start;flex-direction: column;">
      <div class="aside-warning info">
        <i class="material-icons">warning</i>
        <span>{{msg?.memo}}</span>
      </div>
      <!-- <p>Are you sure, you want to continue?</p> -->
    </div>
  </div>
  <div class="dialog-footer">
    <div class="flex1"></div>
    <a mat-dialog-close class="enbutton cancel m-r16" mat-button (click)="onClose('no')">បោះបង់</a>
    <button type="submit" class="enbutton primary m-r16" mat-raised-button (click)="dialogRef.close('yes')"
      color="warn">យល់ព្រម</button>
  </div>
</div>
