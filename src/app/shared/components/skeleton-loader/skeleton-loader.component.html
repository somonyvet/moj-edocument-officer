<div class="fb-item" style="padding: 24px;">
    <div class="first-section-wrapper" style="display: flex;flex-direction: row; align-items: center;">
        <div class="gravatar">
            <ngx-skeleton-loader appearance="circle" [theme]="{ width: '80px', height: '80px' }">
            </ngx-skeleton-loader>
        </div>
        <div class="gravatar-title" style="flex: 1;">
            <div>
                <ngx-skeleton-loader [theme]="{
          width: '100%',
          'border-radius': '8px',
          height: '15px',
          'margin-bottom': '10px'
        }"></ngx-skeleton-loader>
            </div>
            <div>
                <ngx-skeleton-loader [theme]="{ width: '100%', 'border-radius': '8px', height: '15px' }">
                </ngx-skeleton-loader>
            </div>
        </div>
    </div>
</div>
