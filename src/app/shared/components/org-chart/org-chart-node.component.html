<div class="ngx-org">
  <div class="ngx-org-self ngx-org-self-vertical">
    <div class="ngx-org-box ngx-org-border" [ngClass]="$safeNavigationMigration(node?.cssClass)">
      @if (node?.image) {
        <img class="ngx-org-image" [src]="node.image">
      }
      <div class="ngx-org-name">{{ node?.name }}</div>
      @if (node?.title) {
        <div class="ngx-org-title">{{ node?.title }}</div>
      }
    </div>
  </div>

  @if (node?.childs?.length) {
    <div class="ngx-org-container-vertical ngx-org-org-container-vertical">
      <div class="ngx-org-connector ngx-org-connector-vertical"></div>
      <div class="ngx-org-childs ngx-org-childs-vertical">
        @for (child of node.childs; track child) {
          <app-org-chart-node [node]="child"></app-org-chart-node>
        }
      </div>
    </div>
  }
</div>
