<div class="profile-item" matRipple (click)="onOpenChart(item)">
  <div class="g-avt">
    <img class="avatar" [src]="item?.file?$safeNavigationMigration(item?.file?.downloadUrl):NO_AVATAR" />
    @if (presence$ | async; as presence) {
      <div class="profile-status">
        <span [ngClass]="{'is-success':  presence.status  === 'online' || presence.status  === 'away'}"></span>
      </div>
    }
  </div>

  <div class="columns flex1">
    <span style="text-transform: capitalize;">{{item?.displayName}}</span>
    @if (!hidePhone) {
      <span style="margin-top: 4px; display: flex;">{{item?.mobile_phone}}</span>
    }
  </div>

</div>
