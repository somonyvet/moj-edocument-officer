<div class="chat left" (click)="chatClicked()">
  <div class="image-container">
    <img [src]="photoURL">
  </div>

  <div class="content">
    <label for="dateTime-toggle">
      @if (value) {
        @if (!(value|validateUrl)) {
          <p class="text">{{ value }}</p>
        }
        @if ((value|validateUrl)) {
          <a class="text" [href]="value" target="blank">{{ value }}</a>
        }
      }

      @if (fileAudio?.length>0) {
        <audio class="audio-swot" controls [src]="audioUrl"></audio>
      }

      @if (fileImages?.length>0) {
        <div class="img-gride" [ngClass]="'grid' + fileImages.length">
          @for (item of fileImages; track item) {
            <img [src]="item?.downloadURL || item?.downloadUrl">
          }
        </div>
      }

    </label>

    @if (isClicked) {
      <p class="time-seen">
        <span class="time">{{ dateTime | amTimeAgo }}</span>
      </p>
    }
  </div>
</div>
