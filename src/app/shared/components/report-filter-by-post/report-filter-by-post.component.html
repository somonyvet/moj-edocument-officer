<div class="filter-penal" style="width: 350px;">

  <h4>ជ្រើសរើសតាមប៉ុស្តិ៍</h4>
  <label class="label-date">ប៉ុស្តិ៍</label>
  <div class="from-date-to-date  w-full">
    <div class="date-bl">
      <mat-select [formControl]="inspection" [compareWith]="compareWith">
        @for (item of inspectionList; track item) {
          <mat-option [value]="item">
            {{item?.name}}
          </mat-option>
        }
      </mat-select>
    </div>
  </div>

  <div class="price-footer">
    <button mat-button (click)="_onPress(false)" class="btn-apply">បង្ហាញទិន្នន័យ</button>
  </div>
</div>
