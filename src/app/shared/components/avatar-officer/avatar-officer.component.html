@if (!loading && item) {
  <div class="officer-avatar" [ngClass]="removeStyle?'removed':''">
    <img [src]="$safeNavigationMigration(item?.photoUrl)" [ngClass]="imgCss" [style.border-color]="borderColor" (error)="handleImgError($event)"
      (click)="_onEdit()">
    <div class="officer-name" (click)="_onEdit()">
      <span>{{item?.displayName}}</span>
      @if (description) {
        <p>{{description}}</p>
      }
    </div>
    @if (checkIcon) {
      <span class="material-icons checked">
        check_circle
      </span>
    }
    @if (removeStyle && !isOwner) {
      <span class="material-icons" (click)="_onRemove()">
        close
      </span>
    }
  </div>
}
