<div class="apply-form-page offi">
  <div class="eform small">

    <div class="header-ef">
      <h2 style="margin-bottom:12px;">ដកព្រឹត្តិបត្រថ្កោលទោស</h2>
      <div class="lottie-box">
        <ng-lottie [options]="lottie" width="100%" height="100%"></ng-lottie>
      </div>
      <div class="error" *ngIf="criminalStore?.selectedCriminalRecord?.status?.key < 11">
        <p class="error-text">! ព្រឹត្តិបត្រកំពុងរៀបចំមិនទាន់អាចដកបាន</p>
      </div>
      <div class="btn-done" *ngIf="criminalStore?.selectedCriminalRecord?.status?.key == 12">
        <mat-icon>check_circle</mat-icon>
        <p>ព្រឹត្តិបត្រថ្កោលទោសបានដករួចរាល់</p>
      </div>
      <button [disabled]="process" mat-button class="btn-withdraw" (click)="process ? null : withdrawCriminalRecord()" *ngIf="criminalStore?.selectedCriminalRecord?.status?.key == 11">
        <div class="wrapper">
          <mat-spinner [diameter]="26" *ngIf="process" class="spinner-white"></mat-spinner>
          ដកព្រឹត្តិបត្រថ្កោលទោស
        </div>
      </button>
      <ng-container *ngIf="criminalStore?.selectedCriminalRecord?.status?.key == 12">
        <div class="doc-file-p">
          <div class="attach-file-pdf">
            <mat-spinner [diameter]="26" *ngIf="process"></mat-spinner>
            <p (click)="download()" *ngIf="!process">{{criminalStore?.selectedCriminalRecord?.attachment_pdf?.name}}</p>
          </div>
        </div>
      </ng-container>
    </div>

  </div>
</div>
