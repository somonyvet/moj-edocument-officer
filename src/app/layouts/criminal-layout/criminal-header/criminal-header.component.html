    <a mat-button mat-icon-button matTooltipClass="tooltipClass" [matMenuTriggerFor]="languageMenu"
      class="btn-p-icon app-button" matTooltip="ជ្រើសរើសភាសា">
      <mat-icon>
        <ion-icon name="globe-outline"></ion-icon>
      </mat-icon>
    </a>
    <mat-menu #languageMenu="matMenu">
      <div class="user-notify">
        <h1>{{lang?.strings['selectLanguage']}}</h1>
        <button type="button" mat-button class="devsite-cpwd" [ngClass]="lang?.language===item?.key?'active':''"
          *ngFor="let item of languages" (click)="onChangeLanguage(item)">
          <div class="devsite-list-text">
            <img [src]="item?.icon">
            <span>{{item?.name}}</span>
            <mat-icon>{{lang?.language===item?.key?'radio_button_checked':'radio_button_unchecked'}}</mat-icon>
          </div>
        </button>
      </div>
    </mat-menu>

    <a mat-button mat-icon-button [matMenuTriggerFor]="notificationsMenu" matTooltipClass="tooltipClass"
      (click)="onNotification('total_notify')" [matBadge]="auth?.totalNotify" [matBadgeHidden]="auth?.totalNotify<=0"
      matBadgeColor="warn" class="btn-p-icon app-button" matTooltip="ជូនដំណឹង">
      <mat-icon>
        <ion-icon name="notifications"></ion-icon>
      </mat-icon>
    </a>

    <mat-menu #notificationsMenu="matMenu">
      <div class="notify-lists">
        <div class="notify-lists-header">
          <h4>ជូនដំណឹង</h4>
        </div>
        <mat-divider></mat-divider>
        <div class="noNotify" *ngIf="notify?.notifications?.length === 0">
          មិនមានទិន្នន័យ
        </div>
        <virtual-scroller #scroll [items]="notify?.notifications" (vsEnd)="fetchMore($event)">
          <div class="notify-list-item" (click)="onDocument(item,i)"
            *ngFor="let item of scroll.viewPortItems;let i=index">
            <div class="img-box">
              <img *ngIf="item?.notifyBy?.file?.downloadUrl" [src]="item?.notifyBy?.file?.downloadUrl" alt="">
              <img *ngIf="!item?.notifyBy?.file?.downloadUrl" [src]="NO_AVATAR" alt="">
            </div>
            <div class="list-text">
              <strong>{{item?.body}}</strong>
              <span>{{item?.created_at?.toDate() | amTimeAgo}}</span>
            </div>
          </div>
          <app-spinner *ngIf="notify.fetching"></app-spinner>
        </virtual-scroller>
      </div>
    </mat-menu>
    <a mat-button mat-icon-button [matMenuTriggerFor]="userMenu" matTooltipClass="tooltipClass" matTooltip="គណនី"
      class="btn-p-icon">
      <img [src]="photoUrl ||auth?.photoUrl" alt="GDI" alt="user">
    </a>
    <mat-menu #userMenu="matMenu">
      <div class="user-notify" (click)="$event.stopPropagation();">
        <div class="notify-lists-header">
          <ng-container *ngFor="let item of auth?.currentDepartment?.workplaceDisplayPath;let i=index;">
            <h4 *ngIf="i===0">{{item?.name}}</h4>
            <p *ngIf="i>0">{{item?.name}}</p>
          </ng-container>
        </div>
        <div class="wellcome-user" style="text-align: center;">
          <div class="empty-avatar" style="height: 120px; width: 120px; margin: 0 auto;">
            <img [src]="photoUrl || auth?.photoUrl" alt="GDI" alt="user">
            <div (click)="fileInput.click()" class="change-profile">
              <mat-icon class="mat-18">photo_camera</mat-icon>
            </div>
          </div>

          <input #fileInput id="fileInput" type="file" accept='.png, .jpg, .jpeg' (change)="onSelectedFile($event)"
            style="display:none;" />
          <div class="wellcome-text k-wellcome-text" style="margin-top: 10px;">
            <span>{{auth?.profile?.email}}</span>
          </div>
          <div class="wellcome-text k-wellcome-text cap" style="margin-top: 5px;">
            <span>{{auth?.profile?.displayName}}</span>
          </div>
          <mat-progress-bar *ngIf="START_UPLOAD" mode="determinate" [value]="uploadPercent | async ">
          </mat-progress-bar>
        </div>

        <div class="nav-committee-u" *ngIf="auth?.currentDepartment">
          <mat-icon>stay_current_portrait</mat-icon>
          <div class="nav-committee-u-t">
            <h5>{{auth?.profile?.currentTitle}}</h5>
          </div>
        </div>

        <mat-divider></mat-divider>
        <button type="button" mat-button class="devsite-cpwd" (click)="onLogOut()">
          <div class="devsite-list-text">
            <div class="icon-round">
              <mat-icon>lock</mat-icon>
            </div>
            <span>ចេញពីប្រព័ន្ធ</span>
          </div>
        </button>
      </div>
    </mat-menu>
