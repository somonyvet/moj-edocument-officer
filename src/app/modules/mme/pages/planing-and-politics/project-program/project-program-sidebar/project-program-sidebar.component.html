      <div class="nav-dock-body">
        <nav mat-tab-nav-bar [tabPanel]="tabPanel">
            <a mat-tab-link *ngFor="let link of tabs" [routerLink]="link.path" routerLinkActive
                #rla="routerLinkActive" [active]="rla.isActive">{{link.label}}</a>
        </nav>
<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
        <router-outlet *ngIf="!loading else formLoading">
        </router-outlet>
        <ng-template #formLoading>
            <app-skeleton-loader></app-skeleton-loader>
        </ng-template>
      </div>

      <div class="nav-dock-footer" *ngIf="!loading">
          <div class="site-nav-button">
              <a mat-button class="mat-btn-primary" [ngClass]="auth?.planing?.key?'':'disabled'" (click)="_onPublicAnnualProject()">
                  ដាក់ឲ្យលើកផែនការត្រីមាស
              </a>
              <div class="scb9dxdrList pad16">
                  <a mat-button class="scb9dxdrBox" [ngClass]="auth?.planing?.key?'':'disabled'"
                      [routerLink]="['/planing/' + auth?.planing?.key + '/na/draft/form']">
                      <div class="boxIcon">
                          <mat-icon>edit_calendar</mat-icon>
                      </div>
                      <div class="boxTxt">
                          បញ្ចូលកម្មវិធីក្នុងផែនការប្រចាំឆ្នាំ
                      </div>
                  </a>
                  <a mat-button class="scb9dxdrBox" (click)="create()">
                      <div class="boxIcon">
                          <mat-icon>source</mat-icon>
                      </div>
                      <div class="boxTxt">
                          បង្កើតផែនការប្រចាំឆ្នាំ
                      </div>
                  </a>
                  <a mat-button class="scb9dxdrBox" [routerLink]="['/apps/year-program']">
                      <div class="boxIcon">
                          <mat-icon>newspaper</mat-icon>
                      </div>
                      <div class="boxTxt">
                          ផែនការប្រចាំឆ្នាំ
                      </div>
                  </a>
              </div>
          </div>

      </div>
