<form [formGroup]="form" class="dialog-content-wrapper">
    <div class="dialog-header">
      <h2 mat-dialog-title>{{title}}</h2>
      <div class="space1"></div>
      <div mat-button mat-icon-button (click)="dialogRef.close()">
        <mat-icon class="mat-18">clear</mat-icon>
      </div>
    </div>
    <mat-dialog-content class="form-wrapper">
      <div class="form-group">
        <mat-form-field appearance="outline">
          <mat-label>Name</mat-label>
          <input #inputRef type="text" matInput formControlName="name">
          <mat-error *ngIf="form.controls['name'].hasError('required')">
            ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
          </mat-error>
        </mat-form-field>
      </div>
      <div class="form-group two">
        <mat-form-field appearance="outline">
          <mat-label>Order</mat-label>
          <input type="number" matInput formControlName="order">
          <mat-error *ngIf="form.controls['order'].hasError('required')">
            ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
          </mat-error>
        </mat-form-field>
      </div>
      <div class="form-group two">
        <mat-form-field appearance="outline">
          <mat-label>Name KH</mat-label>
          <input type="text" matInput formControlName="name_kh">
          <mat-error *ngIf="form.controls['name_kh'].hasError('required')">
            ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
          </mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Color</mat-label>
          <input type="text" matInput formControlName="color">
          <mat-error *ngIf="form.controls['color'].hasError('required')">
            ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
          </mat-error>
        </mat-form-field>
      </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <div class="flex1"></div>
      <a mat-button mat-dialog-close class="cancel-btn">បោះបង់</a>
      <button class="submit-btn" mat-button type="submit" (click)="_onSave(form.value)">រក្សាទុក</button>
    </mat-dialog-actions>
  </form>
