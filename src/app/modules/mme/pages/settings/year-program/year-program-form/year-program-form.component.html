<form [formGroup]="form" class="dialog-content-wrapper">
  <div class="dialog-header">
    <h2 mat-dialog-title>{{title}}</h2>
    <div class="space1"></div>
    <div mat-button mat-icon-button (click)="dialogRef.close()">
      <mat-icon class="mat-18">clear</mat-icon>
    </div>
  </div>
  <mat-dialog-content class="form-wrapper">
    <div class="form-group">
      <mat-form-field appearance="outline">
        <mat-label>ឈ្មោះឆ្នាំ</mat-label>
        <input #inputRef cdkFocusInitial matInputAutofocus formControlName="name" required matInput
          placeholder="ឈ្មោះឆ្នាំ">
        <mat-error *ngIf="form.controls['name'].hasError('required')">
          ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
        </mat-error>
        <mat-error *ngIf="form.controls['name'].hasError('nameAvailable')" class="error-message">
          ឈ្មោះនេះត្រូវបានយកទៅប្រើម្ដងហើយ
        </mat-error>
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field appearance="outline">
        <mat-label>ឆ្នាំសម្រាប់កម្មវិធី</mat-label>
        <input type="number" matInput formControlName="year">
        <mat-error *ngIf="form.controls['year'].hasError('required')">
          ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ
        </mat-error>
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field appearance="outline">
        <mat-label>ពិពណ៌នា</mat-label>
        <input type="text" matInput  formControlName="description">
      </mat-form-field>
    </div>

    <div class="form-group" *ngIf="!data?.item">
      <mat-form-field class="example-full-width" appearance="outline">
        <mat-label>កំណត់សម្គាល់</mat-label>
        <textarea rows="3" formControlName="description" matInput></textarea>
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-checkbox class="mat-check-form" formControlName="setActive">ដាក់បញ្ចូលកម្មវិធីក្នុងផែនការប្រចាំឆ្នាំ
      </mat-checkbox>
    </div>
  </mat-dialog-content>
  <mat-progress-bar mode="indeterminate" *ngIf="process">
  </mat-progress-bar>
  <mat-dialog-actions align="end">
    <div class="flex1"></div>
    <a mat-button mat-dialog-close class="cancel-btn">បោះបង់</a>
    <button class="submit-btn" mat-button type="submit" (click)="_onSave(form.value)">រក្សាទុក</button>
  </mat-dialog-actions>
</form>
