<!-- class="as-tb-wrap vt-doc" -->
<virtual-scroller #scroll (vsEnd)="_onScroll($event)" [items]="store?.data" [parentScroll]="scroll.window">
  <table class="as-table-wrapper" *ngIf="store?.data?.length>0 && !store?.loading">
    <thead #header>
      <tr>
        <th class="center">
          ល.រ
        </th>
        <th class="left">
          អត្តលេខ
        </th>
        <th class="left">
          ឈ្មោះ
        </th>

        <th>

        </th>
      </tr>
    </thead>
    <tbody #container>
      <tr *ngFor="let item of scroll?.viewPortItems; let i = index">
        <td class="center" style="width: 64px;">
          {{item?.index}}
        </td>
        <td style="width: 300px;">
          <div class="rows" [routerLink]="['/document-template/form/' + item?.key]">
            <div class="avatar-tb" style="cursor: pointer;">
              <mat-icon class="mat-18">launch</mat-icon>
            </div>
            <strong>{{item?.documentNo}}</strong>
          </div>
        </td>
        <td>
          <div class="rows" style="white-space: normal;">
            <span>{{item?.documentName}}</span>
          </div>
        </td>
        <td style="width: 64px;">
          <div class="card-list-action">
            <button mat-button mat-icon-button [matMenuTriggerFor]="menu">
              <i class="material-icons">more_vert</i>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="create(item)">
                <mat-icon>edit</mat-icon>
                <span>កែប្រែ</span>
              </button>
              <button mat-menu-item *ngIf="item?.created_by === auth?.uid" (click)="delete(item)">
                <mat-icon>delete</mat-icon>
                <span>លុប</span>
              </button>
            </mat-menu>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
  <ng-container *ngIf="store?.data?.length===0 && !store?.loading">
    <div class="empty-block">
      <div class="center-block-empty">
        <div class="empty-img">
          <img src="https://mobilecenter.azureedge.net/generated/img/no-apps-db6363dd644196e2291b243bc210e1b0.svg"
            alt="empty">
        </div>
        <div class="empty-text">
          <p class="empty-state-title">
            ពុំមានទិន្នន័យ
          </p>
          <p class="empty-state-desc">
            លោកអ្នកអាចបញ្ចូលទិន្នន័យរបស់មន្ត្រីសមត្ថកិច្ចដោយគ្រាន់តែចុចប៊ូតុងបង្កើត
          </p>
        </div>
      </div>
    </div>
  </ng-container>
  <app-spinner *ngIf="store?.loading"></app-spinner>
  <app-spinner *ngIf="store?.fetching"></app-spinner>
  <div class="fake"></div>
</virtual-scroller>
