<form [formGroup]="form" class="dialog-content-wrapper">
    <div class="dialog-header">
        <h2 mat-dialog-title>{{title}}</h2>
        <div class="space1"></div>
        <div mat-button mat-icon-button (click)="dialogRef.close()">
            <mat-icon class="mat-18">clear</mat-icon>
        </div>
    </div>
    <mat-dialog-content class="form-wrapper">
        <div class="form-group">
            <mat-form-field appearance="outline">
                <mat-label>ឈ្មោះ</mat-label>
                <input formControlName="name" required matInput placeholder="ឈ្មោះ">
                <mat-error *ngIf="form.controls['name'].hasError('required')">
                    ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
                </mat-error>
                <mat-error *ngIf="form.controls['name'].hasError('nameAvailable')" class="error-message">
                    ឈ្មោះនេះត្រូវបានយកទៅប្រើម្ដងហើយ
                </mat-error>
            </mat-form-field>
        </div>
        <div class="form-group two">
            <mat-form-field appearance="outline">
                <mat-label>ឈ្មោះខ្លី</mat-label>
                <input formControlName="short_name" matInput placeholder="ឈ្មោះខ្លី">
                <mat-error *ngIf="form.controls['short_name'].hasError('required')">
                    ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
                </mat-error>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>លេខរៀង</mat-label>
                <input type="number" formControlName="order" matInput placeholder="លេខរៀង">
            </mat-form-field>
        </div>
        <div class="form-group two">
            <mat-form-field appearance="fill">
                <mat-label>ប្រភេទ</mat-label>
                <mat-select formControlName="category" [compareWith]="ds?.compareWithObj">
                    <mat-option *ngFor="let item of VISA_SETTING_LIST" [value]="item">
                        {{item?.name}}
                    </mat-option>
                </mat-select>
                <mat-error *ngIf="form.controls['category'].hasError('required')">
                    This field is required.
                </mat-error>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>តំលៃ</mat-label>
                <input type="number" formControlName="price" matInput placeholder="តំលៃ">
            </mat-form-field>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <div class="flex1"></div>
        <a mat-button mat-dialog-close class="cancel-btn">បោះបង់</a>
        <button class="submit-btn" mat-button type="submit" (click)="_onSave(form.value)">រក្សាទុក</button>
    </mat-dialog-actions>
</form>
