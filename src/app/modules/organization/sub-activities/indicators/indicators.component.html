<form class="dialog-content-wrapper">
  <div class="dialog-header">
    <h2 mat-dialog-title>{{title}}</h2>
    <div class="space1"></div>
    <div mat-button mat-icon-button (click)="dialogRef.close()">
      <mat-icon class="mat-18">clear</mat-icon>
    </div>
  </div>
  <mat-dialog-content class="form-wrapper">

    <div class="page-doc">
        <div class="form-group four" style="justify-content: space-evenly;">
                <button class="mat-puc mat-button" (click)="goFirst()">សូចនាករប្រចាំត្រីមាសទី១</button>
                <button class="mat-puc mat-button" (click)="goSecond()">សូចនាករប្រចាំត្រីមាសទី២</button>
                <button class="mat-puc mat-button" (click)="goThird()">សូចនាករប្រចាំត្រីមាសទី៣</button>
                <button class="mat-puc mat-button" (click)="goForth()">សូចនាករប្រចាំត្រីមាសទី៤</button>


        </div>

          <div class="empty-block">

              <div class="empty-img">
                <img src="https://mobilecenter.azureedge.net/generated/img/no-apps-db6363dd644196e2291b243bc210e1b0.svg"
                  alt="empty">
              </div>
              <div class="empty-text">
                <p class="empty-state-title">
                  ពុំមានទិន្នន័យ

                </p>
              </div>
            </div>

  <mat-dialog-actions align="end">
    <div class="flex1"></div>
    <a mat-button mat-dialog-close class="cancel-btn">បោះបង់</a>
