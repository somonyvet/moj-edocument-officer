<form [formGroup]="form" class="dialog-content-wrapper">
  <div class="dialog-header">
    <h2 mat-dialog-title>{{titleForm}}</h2>
    <div class="space1"></div>
    <div mat-button mat-icon-button (click)="dialogRef.close()">
      <mat-icon class="mat-18">clear</mat-icon>
    </div>
  </div>
  <mat-dialog-content class="form-wrapper">
    <div class="photo-pro">
      <div class="avatar">
        <img [src]="URL" />
        <div (click)="photoFile.click()" class="change-profile">
          <mat-icon class="mat-icon" role="img">
            photo_camera
          </mat-icon>
        </div>
      </div>
      <input #photoFile type="file" accept='image/*' (change)="onSelectedFile($event)" style="display:none;" />
    </div>
    <div class="form-group">
      <mat-form-field appearance="outline">
        <mat-label>ឈ្មោះជាភាសាខ្មែរ</mat-label>
        <input #inputRef formControlName="name" required matInput placeholder="ឈ្មោះជាភាសាខ្មែរ">
        <mat-error *ngIf="form.controls['name'].hasError('required')">
          ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
        </mat-error>
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field appearance="outline">
        <mat-label>ឈ្មោះជាភាសាអង់គ្លេស</mat-label>
        <input #inputRef formControlName="name_en" required matInput placeholder="ឈ្មោះជាភាសាអង់គ្លេស">
        <mat-error *ngIf="form.controls['name_en'].hasError('required')">
          ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
        </mat-error>
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field appearance="outline">
        <mat-label>អ៊ីមែល</mat-label>
        <input #inputRef formControlName="email" matInput placeholder="អ៊ីមែល">
        <mat-error *ngIf="form.controls['email'].hasError('required')">
          ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
        </mat-error>
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field appearance="outline">
        <mat-label>គេហទំព័រ</mat-label>
        <input #inputRef formControlName="website" matInput placeholder="គេហទំព័រ">
        <mat-error *ngIf="form.controls['website'].hasError('required')">
          ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
        </mat-error>
      </mat-form-field>
    </div>

  </mat-dialog-content>
  <mat-progress-bar mode="determinate" [value]="storage?.uploadPercent | async " *ngIf="storage?.startUpload">
  </mat-progress-bar>
  <mat-dialog-actions align="end">
    <div class="flex1"></div>
    <a mat-button mat-dialog-close class="cancel-btn">បោះបង់</a>
    <button class="submit-btn" mat-button type="submit" (click)="_onSave(form.value)">រក្សាទុក</button>
  </mat-dialog-actions>
</form>
