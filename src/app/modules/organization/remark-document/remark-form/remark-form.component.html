<form [formGroup]="form" class="dialog-content-wrapper">
    <div class="dialog-header">
        <h2 mat-dialog-title>{{title}}</h2>
        <div class="space1"></div>
        <div mat-button mat-icon-button (click)="dialogRef.close()">
            <mat-icon class="mat-18">clear</mat-icon>
        </div>
    </div>
    <mat-dialog-content class="form-wrapper">
        <div class="form-group">
            <mat-form-field appearance="outline">
                <mat-label>ចំណារ</mat-label>
                <input #inputRef cdkFocusInitial matInputAutofocus formControlName="remarkText" required matInput placeholder="ចំណារ">
                <mat-error *ngIf="form.controls['remarkText'].hasError('required')">
                    ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
                </mat-error>
                <mat-error *ngIf="form.controls['remarkText'].hasError('nameAvailable')" class="error-message">
                    ឈ្មោះនេះត្រូវបានយកទៅប្រើម្ដងហើយ
                </mat-error>
            </mat-form-field>
        </div>

            <mat-form-field appearance="outline">
                <mat-label>ចំណារឯកភាពរបស់</mat-label>
                <input required [matAutocomplete]="autoSubOfCommittee" formControlName="officer" matInput
                    placeholder="ចំណារឯកភាពរបស់">
                <mat-autocomplete [displayWith]="displayFn" #autoSubOfCommittee="matAutocomplete">
                    <mat-option *ngFor="let item of filteredOptionsOfficer | async;let i=index" [value]="item">
                        {{item?.last_name}} {{item?.first_name}}
                    </mat-option>
                </mat-autocomplete>
                <mat-error class="error-message" *ngIf="form.controls['officer'].hasError('validKey')">
                    <div>Please select once from list to continue.</div>
                </mat-error>
                <mat-error *ngIf="form.controls['officer'].hasError('required')">
                    This field is required.
                </mat-error>
            </mat-form-field>
        </div> -->
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <div class="flex1"></div>
        <a mat-button mat-dialog-close class="cancel-btn">បោះបង់</a>
        <button class="submit-btn" mat-button type="submit" (click)="_onSave(form.value)">រក្សាទុក</button>
    </mat-dialog-actions>
</form>
