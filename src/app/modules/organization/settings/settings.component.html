<div class="page-container" *mobxAutorun>
    <div class="action-bar sticky-tools">
        <div class="nav-content">
            <h3 class="head-title">
                ការកំណត់
            </h3>
        </div>
        <nav mat-tab-nav-bar>
            <a mat-tab-link *ngFor="let link of tabs" [routerLink]="link.path" routerLinkActive #rla="routerLinkActive"
                [active]="rla.isActive">
                {{link.label}}
            </a>
        </nav>
    </div>

    <div class="page-doc nav-r-container">
        <div class="form-tab-doc" style="border-radius: max(0px, min(8px, ((100vw - 4px) - 100%) * 9999)) / 8px;">
            <form [formGroup]="form" class="form-wrapper">
                <div class="form-group">
                    <mat-form-field appearance="outline">
                        <mat-label>កម្រិតស្ថាប័នកំពូល</mat-label>
                        <input [matAutocomplete]="autoCompleteTopManagement" formControlName="startFromLevel" matInput
                            placeholder="">
                        <mat-autocomplete (optionSelected)="optionSelectedPositionChanged($event,'startFromLevel')"
                            [displayWith]="ds.displayFn" #autoCompleteTopManagement="matAutocomplete">
                            <mat-option *ngFor="let item of filterStartFromLevel | async;let i=index" [value]="item">
                                {{item?.name}}
                            </mat-option>
                        </mat-autocomplete>
                        <mat-error class="error-message" *ngIf="form.controls['startFromLevel'].hasError('validKey')">
                            <div>Please select once from list to continue.</div>
                        </mat-error>
                        <mat-error *ngIf="form.controls['startFromLevel'].hasError('required')">
                            This field is required.
                        </mat-error>
                    </mat-form-field>
                </div>

                <div class="form-group" style="margin-left: 10px;">
                    <mat-checkbox (change)="_onCheckChanged($event,'loginWithUsername')" class="example-margin"
                        formControlName="loginWithUsername">ចូលប្រើប្រាស់ប្រព័ន្ធដោយ លេខគណនី

                </div>
                <div class="form-group" style="margin-left: 10px;">
                    <mat-checkbox (change)="_onCheckChanged($event,'loginWithOTP')" class="example-margin"

                <div class="form-hashtag" style="margin:20px 0;">
                    <h4>ទំនាក់ទំនងក្រុមបច្ចេកទេស</h4>
                    <div class="form-group" style="margin-bottom: 0;">
                        <mat-form-field appearance="outline">
                            <mat-label>លេខទូរស័ព្ទ</mat-label>
                            <input formControlName="contactSupport" matInput placeholder="លេខទូរស័ព្ទ">
                            <button *ngIf="form?.value?.contactSupport" matSuffix mat-icon-button aria-label="Clear"
                                (click)="addTag(form?.value?.contactSupport)" type="submit">
                                <mat-icon>add_circle</mat-icon>
                            </button>
                        </mat-form-field>
                    </div>
                    <mat-chip-list class="example-chip">
                        <mat-chip class="example-box" *ngFor="let tag of contactSupports" (removed)="removeTag(tag)">
                            {{tag}}
                            <button matChipRemove>
                                <mat-icon>cancel</mat-icon>
                            </button>
                        </mat-chip>
                    </mat-chip-list>
                </div>
