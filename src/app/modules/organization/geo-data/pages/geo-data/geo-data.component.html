<div class="page-container" *mobxAutorun>
  <div class="action-bar">
    <div class="nav-content">
        <h3 class="head-title">
          ទិន្នន័យខេត្ត/ក្រុង
        </h3>
        <div class="action-item">
            <button mat-button (click)="create()" class="enbutton primary">បង្កើតទិន្នន័យខេត្ត/ក្រុង</button>
        </div>
    </div>
    <nav mat-tab-nav-bar>
        <a mat-tab-link *ngFor="let link of tabs" [routerLink]="link.path" routerLinkActive #rla="routerLinkActive"
            [active]="rla.isActive">{{link.label}}</a>
    </nav>
  </div>

  <div class="page-doc">
    <virtual-scroller #scroll (vsEnd)="_onScroll($event)" [items]="geo?.provinces" class="as-tb-wrap vt-doc">
        <table class="as-table-wrapper" *ngIf="geo?.provinces?.length>0 && !geo?.loading" style="margin-top: 105px;">
            <thead #header>
                <tr>
                    <th class="center">
                        ល.រ
                    </th>
                    <th class="left">
                      លេខកូដ
                    </th>
                    <th class="left">
                      ឈ្មោះ
                    </th>
                    <th>

                    </th>
                </tr>
            </thead>
            <tbody #container>
              <tr *ngFor="let item of scroll?.viewPortItems; let i = index">
                <td class="center" style="width: 80px;">
                  {{i+1}}
                </td>
                <td style="width: 120px;">
                  <strong class="text-link" [routerLink]="['/apps/geo/' + item?.key +'/districts']">{{item?.id}}</strong>
                </td>
                <td>
                  <strong class="text-link" [routerLink]="['/apps/geo/' + item?.key +'/districts']">{{item?.geo_prefix ? item?.geo_prefix?.name : 'ខេត្ត'}}{{item?.name}}</strong>
                </td>
                <td style="width: 64px;">
                  <div class="card-list-action">
                    <button mat-icon-button [matMenuTriggerFor]="menu">
                      <i class="material-icons">more_vert</i>
                    </button>
                    <mat-menu #menu="matMenu">
                      <button mat-menu-item (click)="create(item)">
                        <mat-icon>edit</mat-icon>
                        <span>កែប្រែ</span>
                      </button>
                    </mat-menu>
                  </div>
                </td>
              </tr>
            </tbody>
        </table>
        <ng-container *ngIf="store?.data?.length===0 && !store?.loading">
            <div class="empty-block">
                <div class="center-block-empty">
                    <div class="empty-img">
                        <img src="https://mobilecenter.azureedge.net/generated/img/no-apps-db6363dd644196e2291b243bc210e1b0.svg"
                            alt="empty">
                    </div>
                    <div class="empty-text">
                        <p class="empty-state-title">
                            ពុំមានទិន្នន័យ
                        </p>
                        <p class="empty-state-desc">
                            លោកអ្នកអាចបញ្ចូលទិន្នន័យរបស់មន្ត្រីសមត្ថកិច្ចដោយគ្រាន់តែចុចប៊ូតុងបង្កើត
                        </p>
                    </div>
                </div>
            </div>
        </ng-container>
        <app-spinner *ngIf="store?.loading"></app-spinner>
        <app-spinner *ngIf="store?.fetching"></app-spinner>
    </virtual-scroller>
  </div>

  <app-spinner *ngIf="geo?.loading || loading"></app-spinner>
</div>
