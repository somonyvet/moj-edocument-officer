<form [formGroup]="form" class="dialog-content-wrapper">
    <div class="dialog-header">
        <h2 mat-dialog-title>{{title}}</h2>
        <div class="space1"></div>
        <button mat-button mat-icon-button (click)="dialogRef.close()">
            <mat-icon class="mat-18">clear</mat-icon>
        </button>
    </div>
    <mat-dialog-content class="form-wrapper">
        
        <div class="form-group">
            <mat-form-field appearance="outline">
                <mat-label>ឃុំ/សង្កាត់</mat-label>
                <input [matAutocomplete]="autoSubOfCommittee" formControlName="commune" matInput
                    placeholder="ឃុំ/សង្កាត់">
                <mat-autocomplete [displayWith]="dd?.displayFn" #autoSubOfCommittee="matAutocomplete">
                    <mat-option *ngFor="let item of filteredOptions | async;let i=index" [value]="item">
                        {{item?.name}}
                    </mat-option>
                </mat-autocomplete>
            </mat-form-field>
        </div>

    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <div class="flex1"></div>
        <a mat-button mat-dialog-close class="enbutton cancel">បោះបង់</a>
        <button  class="enbutton primary" mat-button type="submit"  (click)="create(form.value, false)">រក្សាទុក</button>
    </mat-dialog-actions>
</form>
