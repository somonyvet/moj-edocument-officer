<form [formGroup]="form" class="dialog-content-wrapper">
    <div class="dialog-header">
        <h2 mat-dialog-title>{{title}}</h2>
        <div class="space1"></div>
        <a mat-button mat-icon-button (click)="dialogRef.close()">
            <mat-icon class="mat-18">clear</mat-icon>
        </a>
    </div>
    <mat-dialog-content class="form-wrapper">
        <div class="form-group">
            <mat-form-field appearance="outline">
                <mat-label>{{data?.level?.name}}</mat-label>
                <input #inputRef cdkFocusInitial matInputAutofocus required [matAutocomplete]="autoCompleteAssistantDepartment" formControlName="workplace" matInput
                    placeholder="">
                <mat-autocomplete (optionSelected)="optionSelectedPosition($event,form?.value)"
                    [displayWith]="ds.displayFn" #autoCompleteAssistantDepartment="matAutocomplete">
                    <mat-option *ngFor="let item of filteredWorkplace | async;let i=index" [value]="item">
                        {{item?.name}}
                    </mat-option>
                </mat-autocomplete>
                <mat-error class="error-message" *ngIf="form.controls['workplace'].hasError('validKey')">
                    <div>Please select once from list to continue.</div>
                </mat-error>
                <mat-error *ngIf="form.controls['workplace'].hasError('required')">
                    This field is required.
                </mat-error>
            </mat-form-field>
        </div>
        <div class="form-group column" style="margin: 0 8px;">
            <section style="margin-bottom: 8px;">
                <mat-checkbox class="example-margin" formControlName="approve">ស្នើសុំចុះហត្ថលេខា</mat-checkbox>
            </section>
            <section *ngIf="showIncludeAssistant">
                <mat-checkbox class="example-margin" formControlName="includeAssistant">ផ្ដល់ព័ត៌មានទៅជំនួយការ
                </mat-checkbox>
            </section>
        </div>
        <div class="mat-people-items">
            <app-people-card [officerKey]="item?.officerKey" *ngFor="let item of store?.officers"></app-people-card>
        </div>
    </mat-dialog-content>
    <mat-progress-bar mode="determinate" [value]="storage?.uploadPercent | async " *ngIf="storage?.startUpload">
    </mat-progress-bar>
    <mat-dialog-actions align="end">
        <div class="flex1"></div>
        <a mat-button mat-dialog-close class="cancel-btn">បោះបង់</a>
        <button class="submit-btn" mat-button type="submit" (click)="_onSave(form.value)">រក្សាទុក</button>
    </mat-dialog-actions>
</form>
