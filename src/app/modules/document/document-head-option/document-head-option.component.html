<form [formGroup]="form" class="dialog-content-wrapper">
    <div class="dialog-header">
        <h2 mat-dialog-title>{{title}}</h2>
        <div class="space1"></div>
        <a mat-button mat-icon-button (click)="dialogRef.close(null)">
            <mat-icon class="mat-18">clear</mat-icon>
        </a>
    </div>
    <mat-dialog-content class="form-wrapper">
        <div class="form-group">
            <mat-form-field appearance="fill">
                <mat-label>កម្រិតស្ថាប័នទទួលព័ត៌មាន</mat-label>
                <mat-select formControlName="workplace" [compareWith]="ds?.compareWithObj">
                    <mat-option *ngFor="let item of data?.officer?.workplace" [value]="item">
                        {{item?.name}}
                    </mat-option>
                </mat-select>
                <mat-error *ngIf="form.controls['workplace'].hasError('required')">
                    This field is required.
                </mat-error>
            </mat-form-field>
        </div>
        <mat-radio-group aria-labelledby="example-radio-group-label" class="permission-radio-group"
            formControlName="permission">
            <mat-radio-button [checked]="season?.key===data?.item?.permission?.key" class="permission-radio-button"
                *ngFor="let season of ACCOUNT_PERMISSION_OBJECT_ARRAY" [value]="season">
                {{season?.name}}
            </mat-radio-button>
        </mat-radio-group>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <div class="flex1"></div>
        <a mat-button mat-dialog-close class="cancel-btn">បោះបង់</a>
        <button class="submit-btn" cdkFocusInitial mat-button type="button"
            (click)="_onSave(form?.value)">យល់ព្រម</button>
    </mat-dialog-actions>
</form>
