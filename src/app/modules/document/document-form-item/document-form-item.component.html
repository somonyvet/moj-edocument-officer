<form [formGroup]="form" class="dialog-content-wrapper">
  <div class="dialog-header">
    <h2 mat-dialog-title>{{data?.docType?.name}}</h2>
    <div class="space1"></div>
    <a mat-icon-button (click)="dialogRef.close()">
      <mat-icon class="mat-18">clear</mat-icon>
    </a>
  </div>
  <mat-dialog-content class="form-wrapper">
    <div class="form-group">
      <mat-form-field appearance="outline">
        <mat-label>ប្រភេទ {{data?.docType?.name}}</mat-label>
        <mat-select [compareWith]="" formControlName="type">
          @for (item of data?.item; track item; let i = $index) {
            <mat-option [value]="item">
              <div class="rows">
                <span>{{item?.name}}</span>
              </div>
            </mat-option>
          }
        </mat-select>
        @if (form.controls['type'].hasError('required')) {
          <mat-error>
            This field is required.
          </mat-error>
        }

      </mat-form-field>
    </div>

    <div class="form-group">
      <div class="editor" >
        <ckeditor  [config]="{ placeholder: 'ចំណងជើង'}" [editor]="Editor" data="" formControlName="name"></ckeditor>
      </div>
      <!-- <div *ngIf="form.controls['name'].hasError('required')">
      ចន្លោះ​នេះ​ត្រូវតែ​បំពេញ។
    </div> -->
  </div>

</mat-dialog-content>
@if (storage?.startUpload) {
  <mat-progress-bar mode="determinate" [value]="$safeNavigationMigration(storage?.uploadPercent) | async ">
  </mat-progress-bar>
}
<mat-dialog-actions align="end">
  <div class="flex1"></div>
  <a mat-button mat-dialog-close class="cancel-btn">បោះបង់</a>
  <button class="submit-btn" mat-button type="submit" (click)="_onSave(form.value)">រក្សាទុក</button>
</mat-dialog-actions>
</form>
