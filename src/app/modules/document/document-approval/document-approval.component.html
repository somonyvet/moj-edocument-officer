        <div class="form-group" style="margin-top: 20px;">
            <div style="padding: 16px;">
                បញ្ចូលហត្ថលេខា
            </div>
            <div class="photo-pro">
                <div class="avatar">
                    <img [src]="SIGNATURE_URL" />
                    <div (click)="signatureFile.click()" class="change-profile">
                        <mat-icon class="mat-icon" role="img">
                            photo_camera
                        </mat-icon>
                    </div>
                </div>

                <input #signatureFile type="file" accept='image/*' (change)="onSelectedSignatureFile($event)"
                    style="display:none;" />
            </div>
        </div>

        <app-container-approval-note [remarkFile]="auth?.employee?.remarkFile" [compareWithObj]="ds?.compareWithObj" [form]="form" [uid]="uid" [remarkText]="form.controls['remarkText'].value" [stamp_link]="STAMP_URL"
         (selected_stamp)="onSelectedStampFile($event)"
         (remark_form)="selectedRemark($event)"
         ></app-container-approval-note>

    </mat-dialog-content>
    <mat-progress-bar mode="determinate" [value]="storage?.uploadPercent | async " *ngIf="storage?.startUpload">
    </mat-progress-bar>
    <mat-dialog-actions align="end">
        <div class="flex1"></div>
        <a mat-button mat-dialog-close class="cancel-btn">បោះបង់</a>
        <button class="submit-btn" mat-button type="submit" (click)="_onSave(form.value)">រក្សាទុក</button>
    </mat-dialog-actions>
