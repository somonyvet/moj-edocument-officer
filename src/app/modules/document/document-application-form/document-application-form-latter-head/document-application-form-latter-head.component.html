
<ng-container *mobxAutorun>
  <mat-selection-list [disabled]="$safeNavigationMigration(store?.headerDocument?.final)"  #workplacesJobList (selectionChange)="selectionChangeHeader($event)">
    @for (item of headerData; track item) {
      <mat-list-option [disabled]="$safeNavigationMigration(store?.headerDocument?.final)" [value]="item" [selected]="$safeNavigationMigration(item?.showInHeader)"
        checkboxPosition="before">
        {{item?.name}}
      </mat-list-option>
    }
  </mat-selection-list>
</ng-container>
