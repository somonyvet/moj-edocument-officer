<form [formGroup]="form" class="dialog-content-wrapper">
    <div class="dialog-header">
        <h2 mat-dialog-title>{{titleForm}}</h2>
        <div class="space1"></div>
        <div mat-button mat-icon-button (click)="dialogRef.close()">
            <mat-icon class="mat-18">clear</mat-icon>
        </div>
    </div>
    <mat-dialog-content class="form-wrapper">

        <div class="form-group">
            <mat-form-field appearance="outline">
                <mat-label>ថ្ងៃមោឃៈឯកសារ</mat-label>
                <input formControlName="void_date" required matInput placeholder="ថ្ងៃធ្វើបញ្ចប់ឯកសារ"
                    [matDatepicker]="picker">
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
                <mat-error *ngIf="form?.controls['void_date'].hasError('required')">
                    ព័ត៌មាននេះតម្រូវឲ្យបំពេញ
                </mat-error>
            </mat-form-field>
        </div>

        <div class="form-group">
            <mat-form-field appearance="outline">
                <mat-label>កំណត់សម្គាល់</mat-label>
                <textarea matInput cdkTextareaAutosize #autosize="cdkTextareaAutosize" cdkAutosizeMinRows="1"
                    placeholder="សូមបញ្ចេញយោបល់នៅទីនេះ" formControlName="void_note"></textarea>
            </mat-form-field>
        </div>

    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <div class="flex1"></div>
        <a mat-button mat-dialog-close class="cancel-btn">បោះបង់</a>
        <button class="submit-btn" mat-button type="submit" (click)="_onSave(form.value)">រក្សាទុក</button>
    </mat-dialog-actions>
</form>
