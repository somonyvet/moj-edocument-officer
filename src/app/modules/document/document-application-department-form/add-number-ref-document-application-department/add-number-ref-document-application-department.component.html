<form [formGroup]="form" class="dialog-content-wrapper">
    <div class="dialog-header">
        <h2 mat-dialog-title>{{title}}</h2>
        <div class="space1"></div>
        <div mat-button mat-icon-button (click)="dialogRef.close()">
            <mat-icon class="mat-18">clear</mat-icon>
        </div>
    </div>
    <mat-dialog-content class="form-wrapper">
        <div class="form-group">
            <mat-form-field appearance="outline">
                <mat-label>លេខយោង</mat-label>
                <input #inputRef cdkFocusInitial matInputAutofocus formControlName="number_ref" type="text" required matInput
                    placeholder="លេខយោង">
                <mat-error *ngIf="form.controls['number_ref'].hasError('required')">
                    ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
                </mat-error>
                <mat-error *ngIf="form.controls['number_ref'].hasError('nameAvailable')" class="error-message">
                    លេខកម្រិតគ្រប់គ្រងនេះត្រូវបានយកទៅប្រើម្ដងហើយ
                </mat-error>
            </mat-form-field>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <div class="flex1"></div>
        <a mat-button mat-dialog-close class="cancel-btn">បោះបង់</a>
        <button class="submit-btn" mat-button type="submit" (click)="_onSave(form.value)">រក្សាទុក</button>
    </mat-dialog-actions>
</form>
