<div class="main-panel">
  <div class="main-l doc-list">
    <div class="doc-in">
      <div class="listing-header">
        <div style="display: flex; column-gap: 20px; justify-content: space-between; align-items: center;">
          <h4>{{title}}</h4>
          <div class="nav-right">
            <a style="width: 30px; height: 30px; display: flex;" routerLinkActive="active" mat-icon-button
              matTooltipClass="tooltipClass" class="btn-p-icon app-button" [matTooltip]="'បង្កើត'+title"
              (click)="criminal?.onCreate()">
              <mat-icon>
                <ion-icon name="add-outline"></ion-icon>
              </mat-icon>
            </a>
          </div>
        </div>
      </div>
      <app-search-filter-box [placeholder]="'ស្វែងរក'+title" (searchValue)="onSearch($event)">
      </app-search-filter-box>
      <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="fire-tabs">
        @for (link of tabs; track link) {
          <a mat-tab-link [routerLink]="link.path" routerLinkActive #rla="routerLinkActive"
          [active]="rla.isActive">{{link.label}}</a>
        }
      </nav>
<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>

      @if (!loading) {
        @if (store?.provinces?.length>0) {
          <cdk-virtual-scroll-viewport itemSize="52" #scroll autosize class="doc-ls-items seach-header"
            (vsEnd)="scrollHandler($event)">
            <a mat-button class="avatar-vt-item" routerLinkActive="active"
              *cdkVirtualFor="let item of $safeNavigationMigration(store?.provinces) ;let i=index; trackBy: trackByIdx">
              <div class="avatar sm" [routerLink]="'/criminal-record/applications/geo/'+$safeNavigationMigration(item?.key)+'/districts'">
                <img [src]="$safeNavigationMigration(item?.uri)" (error)="handleImgError($event)">
              </div>
              <a class="av-vt-body" [routerLink]="'/criminal-record/applications/geo/'+$safeNavigationMigration(item?.key)+'/districts'">
                <strong>{{item?.id}} · {{item?.name}}</strong>
              </a>
              <button type="button" mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="criminal.onCreate(item)">
                  <mat-icon>edit</mat-icon>
                  <span>កែសម្រួល</span>
                </button>
                <!-- <button mat-menu-item (click)="onDelete(item)">
                <mat-icon>delete</mat-icon>
                <span>លុប</span>
              </button> -->
            </mat-menu>
          </a>
          <div class="fake"></div>
        </cdk-virtual-scroll-viewport>
      } @else {
        <div class="doc-ls-items center">
          <app-empty className="empty-vt" name="ពុំមានរាជធានី/ខេត្ត" subtitle=""></app-empty>
        </div>
      }
    } @else {
      <app-spinner></app-spinner>
    }
  </div>
</div>
<div class="main-r">
  <router-outlet></router-outlet>
</div>
</div>
