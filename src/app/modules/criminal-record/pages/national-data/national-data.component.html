<router-outlet></router-outlet>
<div class="main-panel">
    <div class="main-l doc-list">
        <div class="doc-in">
            <div class="listing-header">
                <h4>{{title}}</h4>
                <app-search-filter-box [placeholder]="'ស្វែងរក'+title" (searchValue)="onSearch($event)">
                </app-search-filter-box>
                <nav mat-tab-nav-bar class="fire-tabs">
                    <a mat-tab-link *ngFor="let link of tabs" [routerLink]="link.path" routerLinkActive
                        #rla="routerLinkActive" [active]="rla.isActive">{{link.label}}</a>
                </nav>
            </div>
            <ng-container *ngIf="!loading else loader">
                <ng-container *ngIf="store?.nationalities?.length>0 else emptyData">
                    <virtual-scroller #scroll [items]="store?.nationalities" class="doc-ls-items seach-header"
                        (vsEnd)="scrollHandler($event)">
                        <a mat-button class="avatar-vt-item"
                            *ngFor="let item of scroll.viewPortItems ;let i=index; trackBy: trackByIdx">
                            <div class="avatar sm">
                                <img [src]="item?.uri" (error)="handleImgError($event)">
                            </div>
                            <a class="av-vt-body" routerLinkActive="active">
                                <strong>{{item?.num_code}} · {{item?.nationality}}</strong>
                            </a>
                            <button type="button" mat-button mat-icon-button [matMenuTriggerFor]="menu">
                                <mat-icon>more_vert</mat-icon>
                            </button>
                            <mat-menu #menu="matMenu">
                                <button mat-menu-item (click)="criminal.onCreate(item)">
                                    <mat-icon>edit</mat-icon>
                                    <span>កែសម្រួល</span>
                                </button>
                                <button mat-menu-item (click)="onDelete(item)">
                                    <mat-icon>delete</mat-icon>
                                    <span>លុប</span>
                                </button>
                            </mat-menu>
                        </a>
                        <div class="fake"></div>
                    </virtual-scroller>
                </ng-container>
            </ng-container>
            <ng-template #loader>
                <app-spinner></app-spinner>
            </ng-template>
            <ng-template #emptyData>
                <div class="doc-ls-items center">
                    <app-empty className="empty-vt" name="ពុំមានរាជធានី/ខេត្ត" subtitle=""></app-empty>
                </div>
            </ng-template>
        </div>
    </div>
    <div class="main-r">
        <router-outlet></router-outlet>
    </div>
</div>
