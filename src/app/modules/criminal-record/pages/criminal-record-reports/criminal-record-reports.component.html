<div class="main-panel">
  <div class="main-l" [ngStyle]="setToggle()">
    <div class="head-bar">
      <!-- <button mat-button class="enbutton primary" (click)="criminal.onCreate()">
      <div class="rows">
        <ion-icon name="create-outline"></ion-icon>
        <span>{{criminal?.newButtonName}}</span>
      </div>
    </button> -->
  </div>
  <div class="main-body">
    <div class="tog-side-nav">
      @for (item of nav_items; track item) {
        <a class="side-nav-item" mat-button #appTab="routerLinkActive"
          routerLinkActive="active" [routerLink]="[(item?.path?($safeNavigationMigration(item?.path) +'/'):'')+$safeNavigationMigration(item?.router)]">
          <div class="row-content">
            <ion-icon class="flex-none" [name]="$safeNavigationMigration(item?.icon)+(appTab?.isActive?'':'-outline')"></ion-icon>
            <span>{{item?.name}}</span>
          </div>
        </a>
      }
    </div>
  </div>
  <div class="main-calendar">
    <mat-divider></mat-divider>
    <mat-calendar (selectedChange)="_onSelectedCalendar($event)" [(selected)]="selected"></mat-calendar>
  </div>
</div>
<div class="main-r">
  <router-outlet></router-outlet>
</div>
</div>
