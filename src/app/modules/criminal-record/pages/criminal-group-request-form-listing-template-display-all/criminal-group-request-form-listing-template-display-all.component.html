<div class="btn-3container" *ngIf="!loading">
  <button class="btn-3" mat-button (click)="openDialogPrint(criminalRecords,CRIMINAL_APPLICATION_LANGUAGE?.khmer?.key)">ព្រឹត្តិបត្រថ្កោលទោសភាសា ខ្មែរ</button>
  <button class="btn-3" mat-button (click)="openDialogPrint(criminalRecords,CRIMINAL_APPLICATION_LANGUAGE?.english?.key)">ព្រឹត្តិបត្រថ្កោលទោសភាសា អង់គ្លេស</button>
  <button class="btn-3" mat-button (click)="openDialogPrint(criminalRecords,CRIMINAL_APPLICATION_LANGUAGE?.france?.key)">ព្រឹត្តិបត្រថ្កោលទោសភាសា បារាំង</button>
</div>

<div class="loading" *ngIf="loading">
  <mat-spinner [diameter]="40"></mat-spinner>
</div>
