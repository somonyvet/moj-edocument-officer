<div class="main-panel">
  <div class="main-l doc-list">
    <div class="doc-in">
      <div class="listing-header">
        <div style="display: flex; column-gap: 20px; justify-content: space-between; align-items: center;">
          <h4>{{title}}</h4>
          <div class="flex1"></div>
          <a (click)="create()" matTooltip="បង្កើតថ្ងៃឈប់​សំរាក" matTooltipClass="tooltipClass" mat-button mat-icon-button
            class="mat-b-bg" style="display:grid;place-items:center; background: #e4e6eb;
                        color: #111; margin-right: 15px;">
            <mat-icon class="mat-18">add</mat-icon>
          </a>
        </div>
      </div>

      <nav mat-tab-nav-bar class="fire-tabs">
        <a mat-tab-link *ngFor="let link of tabs" [routerLink]="link.path" routerLinkActive #rla="routerLinkActive"
          [active]="rla.isActive">{{link.label}}</a>
      </nav>

      <ng-container *ngIf="!loading else loader">
        <ng-container *ngIf="store?.data?.length>0 else emptyData">
          <virtual-scroller #scroll [items]="store?.data" class="doc-ls-items seach-header">
            <a mat-button class="avatar-vt-item"
              *ngFor="let item of scroll.viewPortItems ;let i=index; trackBy: trackByIdx">
              <div class="avatar sm">
                <img [src]="item?.uri" (error)="handleImgError($event)">
              </div>
              <a class="av-vt-body" routerLinkActive="active">
                <strong>{{item?.date_kh}}</strong>
                <span style="margin-top: 6px;">{{item?.khName}}</span>
              </a>
              <button type="button" mat-button mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="create(item)">
                  <mat-icon>edit</mat-icon>
                  <span>កែសម្រួល</span>
                </button>
                <button mat-menu-item (click)="delete(item)">
                  <mat-icon>delete</mat-icon>
                  <span>លុប</span>
                </button>
              </mat-menu>
            </a>
            <div class="fake"></div>
          </virtual-scroller>
        </ng-container>
      </ng-container>
      <ng-template #loader>
        <app-spinner></app-spinner>
      </ng-template>
      <ng-template #emptyData>
        <div class="doc-ls-items center">
          <app-empty className="empty-vt" name="ពុំមានសញ្ជាតិ" subtitle=""></app-empty>
        </div>
      </ng-template>
    </div>
  </div>
  <div class="main-r">
    <router-outlet></router-outlet>
  </div>
</div>
