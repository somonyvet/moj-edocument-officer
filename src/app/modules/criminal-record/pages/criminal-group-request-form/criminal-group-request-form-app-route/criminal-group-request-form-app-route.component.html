<div class="full-page-container">
  <div class="header">
    <div class="wrapper">
      <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="fire-tabs flex1">
        @for (link of tabs; track link) {
          <a mat-tab-link [routerLink]="link.key" routerLinkActive #rla="routerLinkActive"
          [active]="rla.isActive">{{link.label}}</a>
        }
      </nav>
<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
      <button mat-icon-button class="mat-add-new" matTooltipClass="tooltipClass" matTooltip="បោះពុម្ព"
        (click)="onPrint()">
        <mat-icon class="mat-18">print</mat-icon>
      </button>
    </div>
  </div>
</div>
@if (!loading) {
  <div class="officer-profile-info-container apply-form-page offi"
style="overflow-x: auto;
height: fit-content;
padding: 0 12px;">
    <router-outlet></router-outlet>
  </div>
}
