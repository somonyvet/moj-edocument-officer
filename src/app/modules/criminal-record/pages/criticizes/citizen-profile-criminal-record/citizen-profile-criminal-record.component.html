<div class="full-page-container">
  <div class="header">
    <div class="wrapper">
      <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="fire-tabs flex1">
        @for (link of tabs; track link) {
          <a mat-tab-link [routerLink]="link.path" routerLinkActive
          #rla="routerLinkActive" [active]="rla.isActive">{{link.label}}</a>
        }
      </nav>
<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
      <app-primary-button (onPress)="onPrint()" label="បោះពុម្ព">
      </app-primary-button>
      <app-primary-button (onPress)="_onSubmit()" label="បញ្ចូលសង្ខេបសាច់រឿង" [disable]="!store?.selectedCriminalRecord && loading">
      </app-primary-button>
    </div>
  </div>
  <div class="body">
    @if (!loading) {
      <router-outlet></router-outlet>
    }
  </div>
</div>
