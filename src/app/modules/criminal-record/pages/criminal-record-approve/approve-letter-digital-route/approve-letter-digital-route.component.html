<div class="full-page-container">
  <div class="header">
    <div class="wrapper">
      <nav mat-tab-nav-bar class="fire-tabs flex1">
        <a mat-tab-link *ngFor="let link of tabs" [routerLink]="link.key" routerLinkActive #rla="routerLinkActive"
          [active]="rla.isActive">{{link.label}}</a>
      </nav>
      <button mat-button class="enbutton cancel print-btn" *ngIf="isBulletin" (click)="onPrint()">
        <span>បោះពុម្ព</span>
      </button>
      <ng-container *ngIf="approver">
        <app-primary-button css="w100 danger" *ngIf="canReject" (onPress)="rejectDocument()" label="បដិសេធ"
            [process]="process">
        </app-primary-button>
        <app-primary-button css="w100" (onPress)="approveDocument()" [label]="doneApprove ? 'បានអនុម័តរួចរាល់' :'អនុម័ត'" [process]="process"
            [disable]="!canApprove">
        </app-primary-button>
      </ng-container>
    </div>
  </div>
</div>
<div class="officer-profile-info-container apply-form-page offi" style="overflow-x: auto;
height: fit-content;
padding: 0 12px;" *ngIf="!loading">
  <div class="reject-banner" *ngIf="isRejected">
    <mat-icon class="reject-banner-icon">error_outline</mat-icon>
    <div class="reject-banner-body">
      <p class="reject-banner-title">
        បដិសេធ
        <span *ngIf="rejectedBy?.display_name"> · {{rejectedBy?.display_name}}</span>
        <span *ngIf="rejectedAt"> · {{rejectedAt?.toDate() | dateTime}}</span>
      </p>
      <p class="reject-banner-reason" *ngIf="rejectReason">{{rejectReason}}</p>
    </div>
  </div>
  <router-outlet></router-outlet>
</div>
