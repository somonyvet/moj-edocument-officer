<div class="main-panel">
    <div class="main-l doc-list">
        <div class="doc-in">
            <div class="listing-header">
                <h4>{{title}}</h4>
                <app-search-filter-box [placeholder]="'ស្វែងរក'+title" (searchValue)="onSearch($event)">
                </app-search-filter-box>
                <nav mat-tab-nav-bar class="fire-tabs">
                    <a mat-tab-link *ngFor="let link of tabs" [routerLink]="link.path" routerLinkActive
                        #rla="routerLinkActive" [active]="rla.isActive">{{link.label}}</a>
                </nav>
            </div>
            <ng-container *ngIf="!loading else loader">
                <ng-container *ngIf="store?.dataByFolder?.length>0 else emptyData">
                    <virtual-scroller #scroll [items]="store?.dataByFolder" class="doc-ls-items seach-header"
                        (vsEnd)="scrollHandler($event)">
                        <div class="rows" *ngFor="let item of scroll.viewPortItems ;let i=index; trackBy: trackByIdx">
                            <a style="width: 100% !important;" mat-button class="avatar-vt-item"
                                [routerLink]="item?.key" routerLinkActive="active">
                                <div class="avatar">
                                    <img [src]="item?.photoUrl" (error)="handleImgError($event)">
                                </div>
                                <div class="av-vt-body">
                                    <strong>{{item?.name}}</strong>
                                    <div class="rows sub-text">
                                        <span class="ct-text">រយៈពេលស្នើសុំ:
                                            <strong>{{item?.period_process_document?.name}}</strong>
                                        </span>
                                        <span class="ct-text" *ngIf="item?.release_date">ថ្ងៃដកឯកសារ:
                                            {{item?.release_date?.toDate() | dateOnly}}</span>
                                        <div class="amTimeAgo">
                                            <ion-icon name="calendar-outline"></ion-icon>
                                            <span matTooltipClass="tooltipClass"
                                                [matTooltip]="item?.created_at?.toDate()| dateTime">{{item?.amTimeAgo}}</span>
                                        </div>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </virtual-scroller>
                </ng-container>

            </ng-container>
            <ng-template #loader>
                <app-spinner></app-spinner>
            </ng-template>
            <ng-template #emptyData>
                <div class="doc-ls-items center">
                    <app-empty className="empty-vt" name="ពុំមានសំណើរសុំព្រឹត្តិបត្រថ្កោលទោស" subtitle=""></app-empty>
                </div>
            </ng-template>
        </div>
    </div>
    <div class="main-r">
        <router-outlet></router-outlet>
    </div>
</div>
