<form [formGroup]="form" class="dialog-content-wrapper">
  <div class="dialog-header">
    <h2 mat-dialog-title>{{title}}</h2>
    <div class="space1"></div>
    <button mat-button mat-icon-button (click)="dialogRef.close()">
      <mat-icon class="mat-18">clear</mat-icon>
    </button>
  </div>
  <mat-dialog-content class="form-wrapper">
    <div class="form-group two">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input formControlName="name" required matInput placeholder="Name (KH)">
        <mat-error *ngIf="form.controls['name'].hasError('required')">
          ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Name (EN)</mat-label>
        <input formControlName="en_name" matInput placeholder="Name (EN)">
        <mat-error *ngIf="form.controls['en_name'].hasError('required')">
          ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-group">
      <section style="margin-bottom: 8px; margin-left: 8px;">
        <mat-checkbox class="example-margin" formControlName="direct">កំណត់ត្រាបន្ទាន់</mat-checkbox>
      </section>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <div class="flex1"></div>
    <a mat-button mat-dialog-close class="enbutton cancel">បោះបង់</a>
    <button class="enbutton primary" mat-button type="submit" (click)="create(form.value, false)">រក្សាទុក</button>
  </mat-dialog-actions>
</form>
