<div class="main-panel">
  <div class="main-l doc-list">
    <div class="doc-in">
      <div class="listing-header">
        <div style="display: flex; column-gap: 20px; justify-content: space-between; align-items: center;">
          <h4 (click)="create()">{{title}}</h4>
        </div>
        <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="fire-tabs">
          <a mat-tab-link [active]="true">ទាំងអស់</a>
        </nav>
<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
      </div>
      @if (!loading) {
        @if (store?.data?.length>0) {
          <cdk-virtual-scroll-viewport itemSize="126" #scroll autosize class="doc-ls-items seach-header">
            <div class="rows" *cdkVirtualFor="let item of $safeNavigationMigration(store?.data) ;let i=index; trackBy: trackByIdx">
              <a mat-button class="avatar-vt-item flex1" [ngClass]="item?.status?.key===STATUS_OBJ?.VOID?.key?'warn':''"
                [routerLink]="$safeNavigationMigration(item?.key)" routerLinkActive="active" (click)="onSelectedApp(item)">
                <div class="avatar">
                  <img [src]="$safeNavigationMigration(item?.photoUrl)" (error)="handleImgError($event)">
                </div>
                <div class="av-vt-body">
                  <strong>{{item?.name}}</strong>
                  <div class="rows sub-text">
                  </div>
                </div>
              </a>
              <button type="button" mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="create(item)">
                  <mat-icon>edit</mat-icon>
                  <span>កែសម្រួល</span>
                </button>
                <button mat-menu-item (click)="onDelete(item)">
                  <mat-icon>delete</mat-icon>
                  <span>លុប</span>
                </button>
              </mat-menu>
            </div>
            <div class="fake"></div>
          </cdk-virtual-scroll-viewport>
        } @else {
          <div class="doc-ls-items center">
            <app-empty className="empty-vt" name="ពុំមានសំណើរសុំព្រឹត្តិបត្រថ្កោលទោស" subtitle=""></app-empty>
          </div>
        }
      } @else {
        <app-spinner></app-spinner>
      }
    </div>
  </div>
  <div class="main-r">
    <router-outlet></router-outlet>
  </div>
</div>
