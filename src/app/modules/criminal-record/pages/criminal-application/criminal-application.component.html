<div class="page-full">
  <div class="nav-col">
    <div class="nav-list-item" (click)="store.toggleMainL = !store.toggleMainL">
      <button type="button" mat-icon-button class="icon-container">
        <ion-icon name="menu-outline"></ion-icon>
      </button>
    </div>
    @for (item of apps_items; track item) {
      <div class="nav-list-item">
        @if (!item?.id_child) {
          <div class="active-space"></div>
          <a class="icon-container" mat-icon-button #appTab="routerLinkActive"
            [routerLink]="['/'+$safeNavigationMigration(item?.module_name)+'/'+$safeNavigationMigration(item?.router)]" routerLinkActive="active"
            [matTooltip]="$safeNavigationMigration(item?.name)" matTooltipClass="tooltipClass">
            <ion-icon [name]="$safeNavigationMigration(item?.icon) + (appTab?.isActive?'':'-outline')"></ion-icon>
          </a>
        } @else {
          <ng-template [ngTemplateOutlet]="ElseTemplate"></ng-template>
        }
      </div>
    }
    <div class="version">
      <p>ជំនាន់</p>
      <p>2.023</p>
    </div>
  </div>
  <div class="nav-col-r">
    <router-outlet></router-outlet>
  </div>
</div>
