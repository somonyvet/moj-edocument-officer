<div class="page-full">
    <div class="nav-col">
        <div class="nav-list-item" (click)="store.toggleMainL = !store.toggleMainL">
            <button type="button" mat-button mat-icon-button class="icon-container">
                <ion-icon name="menu-outline"></ion-icon>
            </button>
        </div>
        <div class="nav-list-item" *ngFor="let item of apps_items">
            <ng-container *ngIf="!item?.id_child else ElseTemplate">
                <div class="active-space"></div>
                <a class="icon-container" mat-button mat-icon-button #appTab="routerLinkActive"
                    [routerLink]="['/'+item?.module_name+'/'+item?.router]" routerLinkActive="active"
                    [matTooltip]="item?.name" matTooltipClass="tooltipClass">
                    <ion-icon [name]="item?.icon + (appTab?.isActive?'':'-outline')"></ion-icon>
                </a>
            </ng-container>
        </div>
        <div class="version">
          <p>ជំនាន់</p>
          <p>2.023</p>
        </div>
    </div>
    <div class="nav-col-r">
        <router-outlet></router-outlet>
    </div>
</div>
