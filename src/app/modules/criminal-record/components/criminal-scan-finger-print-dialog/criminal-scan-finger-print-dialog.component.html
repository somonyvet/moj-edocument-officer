        <a mat-dialog-close class="close-dialog" (click)="dialogRef.close(null)">

        </a>
    </div>

            <img [src]="dataImg" width="150px">

                                    (click)="onCaptureFP()">
                            </div>

                        </div>

                        <!-- </div> -->

                    </form>
