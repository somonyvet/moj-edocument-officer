<ng-container *ngIf="!loading">
  <form [formGroup]="form" class="dialog-wrapper" *mobxAutorun>
    <div class="dialog-header">
      <div class="title">
        បង់ប្រាក់
      </div>
      <div class="flex1"></div>
      <a mat-dialog-close class="close-dialog" (click)="dialogRef.close(null)">
        <i class="material-icons">&#xE14C;</i>
      </a>
    </div>
    <div class="dialog-content">
      <div class="form-wrapper">

        <div class="form-group">
          <mat-form-field appearance="outline">
            <mat-label>កាលបរិច្ឆេទបង់ប្រាក់</mat-label>
            <input formControlName="paid_at" required matInput date="true" (click)="picker1.open()" [matDatepicker]="picker1" (dateInput)="onDateChange($event)">
            <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
            <mat-datepicker #picker1></mat-datepicker>
          </mat-form-field>
       </div>

        <div class="form-group">
          <aside class="special-memo asm-ma m15">
            <strong class="name">ថ្ងៃមកយកព្រឹត្តិបត្រថ្កោលទោស:</strong>
            <strong class="memo" style="font-size: 19px;">{{date}}</strong>
          </aside>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline">
            <mat-label>ថ្ងៃយកព្រឹត្តិបត្រ</mat-label>
            <input #inputRef (dateChange)="_onSelectedCalendar($event)" (click)="picker.open()" formControlName="withdraw_date" [matDatepicker]="picker" required matInput
              placeholder="ចំណងជើង">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
            <mat-error *ngIf="form.controls['withdraw_date'].hasError('required')">
              ព័ត៌មាននេះតម្រូវឲ្យលោកអ្នកបំពេញ។
            </mat-error>
          </mat-form-field>
        </div>

        <app-spinner *ngIf="process"></app-spinner>
      </div>
    </div>
    <div class="dialog-footer">
      <div class="flex1"></div>
      <a mat-dialog-close class="enbutton cancel m-r16" mat-button (click)="dialogRef.close(null)">បោះបង់</a>
      <button type="submit" [disabled]="process" class="enbutton primary" mat-button (click)="_onSubmit(form?.value)"
        >យល់ព្រម</button>
    </div>
  </form>
</ng-container>
