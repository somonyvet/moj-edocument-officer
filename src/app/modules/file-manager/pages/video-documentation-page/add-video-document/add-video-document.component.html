<div class="page-section" *mobxAutorun>
  <div class="command-bar">
    <div class="group-command">
      <div class="nav-item-list">
        <div class="nav-item" style="margin-left: 20px">
          <button mat-button (click)="togglesidebar()">
            <mat-icon class="mat-18">menu</mat-icon>
          </button>
        </div>
        <div class="isSmallScreen" *ngIf="ismobile"></div>
        <div class="isBigScreen" *ngIf="!ismobile"></div>
      </div>

      <button mat-button class="mat-path-file last-path" (click)="goBack()">
        <span>ឯកសារជាវីដេអូ</span>
      </button>
    </div>
  </div>

  <div class="container">
    <div class="cs-form-container">
      <div class="form-wrapper" [formGroup]="form">

        <div class="form-group">
          <mat-form-field appearance="outline">
            <mat-label>Title</mat-label>
            <input matInput #focusInput matInputAutofocus required placeholder="Title" formControlName="title">
            <mat-error *ngIf="form.controls['title'].hasError('required')">
              Title is required.
            </mat-error>
          </mat-form-field>
        </div>

        <div class="quill-edit-container">
          <div class="label"><label>Description</label></div>
          <quill-editor formControlName="description"></quill-editor>
          <p class="custom-field-error" *ngIf="this.form.get('description')?.errors?.required && this.form.get('description')?.touched">Description is required.</p>
        </div>

        <div class="form-group" style="margin-top: 30px;">
          <mat-form-field appearance="outline">
            <mat-label>Youtube Link</mat-label>
            <input matInput #focusInput matInputAutofocus required placeholder="Title" formControlName="youtubeLink">
            <mat-error *ngIf="form.controls['title'].hasError('required')">
              Link is required.
            </mat-error>
          </mat-form-field>
        </div>

        <div class="upload-button-container">
          <div class="label"><label>Upload Files</label></div>
          <button class="btn-upload-file" (click)="fileInput.click()">
            <span class="material-icons-outlined">file_upload</span>
            <span style="margin-left: 10px;">Upload File</span>
          </button>
          <input type="file" #fileInput style="display: none;" multiple (change)="onSelectedFile($event)">
          <p class="custom-field-error" *ngIf="this.form.get('description')?.errors?.required && this.form.get('description')?.touched">Description is required.</p>
        </div>

        <div class="selectedFilesContainer">
          <div class="selectedFileContainer" *ngFor="let item of selectedFiles; let i = index;">
            <div class="selectedFileCard">
              <span class="selectedFileName">{{ i + 1 }}. {{ item.name }}</span>
              <button (click)="onDeleteSelctedFile(i)"><span class="material-icons-outlined">close</span></button>
            </div>
          </div>
        </div>

        <div class="preview-uploaded-image-container" *ngIf="data?.files?.length !== 0 && this.data?.files">
          <div class="line"></div>
          <div class="label"><label>Uploaded Files</label></div>

          <!-- <div class="images-container">
            <div class="image-container" *ngFor="let item of this.data?.files; let i = index;">
              <app-video-js-player [options]="{ autoplay: false, controls: true, responsive: true, height: 400, poster : '/assets/images/lazy-loading.jpg',
                sources: [{ src: item?.imageDownloadURL, type: 'video/mp4' }]}" >
              </app-video-js-player>

              <button (click)="onDeleteUploadedFile(i)">
                <span class="material-icons-outlined">remove_circle_outline</span>
              </button>
            </div>
          </div> -->

          <div *ngFor="let item of this.data?.files; let i = index;">
            <app-video-js-player [options]="{ autoplay: false, controls: true, responsive: true, height: 400, poster : '/assets/images/lazy-loading.jpg',
              sources: [{ src: item?.imageDownloadURL, type: 'video/mp4' }]}" >
            </app-video-js-player>
          </div>

          <div style="height: 100%;" *ngIf="data?.youtubeLink">
            <iframe height="100%" [src]="replaceOldLinkToEmbebable(data?.youtubeLink) | safe : 'resourceUrl'" title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="width: 100%;"></iframe>
          </div>
        </div>

        <div style="padding: 0px 7px 0px; clear: both;">
          <div class="processing-container" *ngIf="firestorageFilesUploadService.startUpload">
            <div class="label"><label>Processing</label></div>
            <mat-progress-bar mode="determinate" [value]="(firestorageFilesUploadService.percentage + firestorageFilesUploadService.percentage_current).toFixed(2)"></mat-progress-bar>
            <div class="progress-bar-description">
              <span>{{ (firestorageFilesUploadService.percentage + firestorageFilesUploadService.percentage_current).toFixed(2) }}% Completed</span>
              <span>Uploading...</span>
            </div>
          </div>

          <div class="d-flex" style="padding: 6px; padding-top: 20px !important; border-top: 1px solid rgb(221, 221, 221); clear: both;">
            <div class="flex-1"></div>
            <a mat-button class="mat-puc cancel" (click)="goBack()">
              <span>Cancel</span>
            </a>
            <app-primary-button (onPress)="onSave(form.value,true)" [process]="processNew" label="Save & New"></app-primary-button>
            <app-primary-button (onPress)="onSave(form.value, false)" [process]="processClose" label="Save & Close"></app-primary-button>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>
