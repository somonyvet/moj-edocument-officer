<div class="file-display">
  @if (!noEye) {
    <button matTooltip="Open" style="margin-right: 12px;" (click)="onOpenItem()" mat-icon-button>
      <mat-icon>{{file?.type?.key===DRIVE_OBJ?.folder?.key?'visibility':'launch'}}</mat-icon>
    </button>
  }
  @if (file?.type?.key===DRIVE_OBJ?.folder?.key) {
    <i [ngStyle]="{'color': $safeNavigationMigration(file?.fileTag?.color)}"
    class="material-icons">{{file|iconDrive:selectedItem}}</i>
  }
  <!-- <img [src]="file|iconDrive:file" *ngIf="file?.type?.key===DRIVE_OBJ?.file?.key" /> -->
  <span>
    {{file?.name}}
  </span>
  @if (file?.shareRef) {
    <span class="isFavorite shared">
      <i class="material-icons">supervisor_account</i>
    </span>
  }
  @if (file?.isFavorite===true) {
    <span class="isFavorite">
      <i class="material-icons">
        star
      </i>
    </span>
  }
  @if (file?.rootLevel) {
    <span class="isFavorite">
      <i class="material-icons">
        lock
      </i>
    </span>
  }
</div>
