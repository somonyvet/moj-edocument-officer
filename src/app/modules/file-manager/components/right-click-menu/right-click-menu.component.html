<ng-container matMenuContent *mobxAutorun>
  <div class="right-click-Menu">
    <button mat-menu-item *ngIf="store?.selectedItem" (click)="onOpenItem(store?.selectedItem)">
      <mat-icon>visibility</mat-icon>
      <span>Open</span>
    </button>

    <button mat-menu-item *ngIf="auth?.root" (click)="store?.newFolder(NEW_FOLDER_DIALOG)">
      <mat-icon>create_new_folder</mat-icon>
      <span>Folder</span>
    </button>

    <button *ngIf="auth?.root || store?.selectedOpenItem?.allowUpload" mat-menu-item (click)="fileInput.click()">
      <mat-icon>cloud_upload </mat-icon>
      <span>File upload </span>
    </button>
    <input #fileInput type="file" multiple (change)="
        fetchSelectedFile(
          fileInput,
          NEW_FILE_DIALOG,
          auth?.user,
          auth?.selectedCompany
        )
      " style="display: none" />

    <div class="break"></div>
    <button *ngIf="FILE?.type?.key === 'file'" (click)="getDownload()" mat-menu-item>
      <mat-icon>system_update_alt</mat-icon>
      <span>Download</span>
    </button>

    <button *ngIf="FILE?.type?.key === 'file'" (click)="getShareLink(store?.selectedItem)" mat-menu-item>
      <mat-icon>link</mat-icon>
      <span>Get shareable link</span>
    </button>

    <button *ngIf="auth?.root && store?.selectedItem?.type?.key==='file'" (click)="sharedPerson()" mat-menu-item>
      <mat-icon>person_add</mat-icon>
      <span>Share</span>
    </button>

    <button mat-menu-item *ngIf="store?.selectedItem?.isFavorite === false" (click)="isFavorite(store?.selectedItem)">
      <mat-icon>folder_special</mat-icon>
      <span>Add to Starred</span>
    </button>
    <button mat-menu-item *ngIf="store?.selectedItem?.isFavorite === true" (click)="isFavorite(store?.selectedItem)">
      <mat-icon>folder_special</mat-icon>
      <span>Remove from Starred</span>
    </button>

    <button
      *ngIf="store?.selectedItem && ((store?.selectedItem?.type?.key==='file' && auth.uid===store?.selectedItem?.created_by?.key) || auth.root)"
      mat-menu-item (click)="rename()">
      <mat-icon>title</mat-icon>
      <span>Rename</span>
    </button>

    <ng-container *ngIf="store?.selectedItem?.type?.key === 'folder' && auth?.root">
      <button mat-menu-item [matMenuTriggerFor]="appMenu">
        <mat-icon>color_lens</mat-icon>
        <span>Change folder color</span>
      </button>
    </ng-container>
    <mat-menu #appMenu="matMenu">
      <div matMenuContent class="tag-content">
        <div class="tag-box" *ngFor="let tag of tagColor">
          <button mat-menu-item (click)="changeColor(tag)" class="tag-item check"
            [ngStyle]="{ 'background-color': tag?.color }">
            <mat-icon>{{
              store?.selectedItem?.fileTag?.color === tag.color
                ? "done_outline"
                : ""
            }}</mat-icon>
          </button>
        </div>
      </div>
    </mat-menu>

    <button *ngIf="auth?.root && store?.selectedItem?.type?.key === 'folder'"
      (click)="store?.newFolder(NEW_FOLDER_DIALOG, this.store.selectedItem)" mat-menu-item aria-label="link">
      <mat-icon>edit</mat-icon>
      <span>Edit</span>
    </button>

    <button *ngIf="store?.selectedItem && auth?.root" mat-menu-item (click)="delete()">
      <mat-icon>delete</mat-icon>
      <span>Remove</span>
    </button>
  </div>
</ng-container>
