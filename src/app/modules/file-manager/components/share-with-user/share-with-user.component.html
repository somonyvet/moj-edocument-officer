<div class="cs-share-link-form">
  <mat-list role="list" class="share-detail">
    <mat-list-item role="listitem" class="share-detail-list">
      <div class="detail-title">
        Get link sharing
        <p class="desc">anyone with the link can view/download</p>
      </div>
    </mat-list-item>
    <mat-list-item role="listitem" class="share-detail-list">
      <mat-form-field class="full-width">
        @if (msg?.type.key=='file') {
          <input matInput disabled value="{{msg?.downloadURL}}">
        }
        @if (msg?.type.key=='folder') {
          <input matInput disabled value="{{url}}/{{msg?.key}}">
        }
      </mat-form-field>
    </mat-list-item>

    <mat-divider style="margin-bottom: 24px;"></mat-divider>
