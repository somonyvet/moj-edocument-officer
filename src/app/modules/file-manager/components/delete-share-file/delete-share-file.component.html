<div class="dialog-wrapper">
    <div class="dialog-header">
        <div class="title">
            Delete Shared file
        </div>
        <div class="flex1"></div>
        <a mat-dialog-close class="close-dialog" (click)="onClose()">
            <i class="material-icons">&#xE14C;</i>
        </a>
    </div>
    <div class="dialog-content">
        <div class="form-content">
            <div class="aside-warning" style="flex-wrap: wrap;">
                <i class="material-icons">warning</i>
                <span style="margin-bottom: 0;">
                    You have shared this file with other user.
                </span>
                <div style="margin: 8px 0;">
                    <p *ngIf="!msg?.warning">This file will be removed from all user you have shared with. </p>
                    <p *ngIf="!msg?.warning">Are you sure you want to delete this shared file?</p>
                </div>
            </div>

        </div>
    </div>
    <div class="dialog-footer">
        <div class="flex-1"></div>
        <button mat-dialog-close type="button" class="enbutton cancel m-r16" mat-button
            (click)="onClose()">Cancel</button>
        <button type="submit" class="enbutton delete-btn" mat-raised-button (click)="dialogRef.close('yes')"
            color="warn">Delete</button>
    </div>
</div>
