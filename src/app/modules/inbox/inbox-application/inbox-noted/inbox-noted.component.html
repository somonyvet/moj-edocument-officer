<div class="document-section-container">
    <div class="page-wrapper page-container doc-noted">
        <div class="page-doc">
            <ng-container *ngIf="store?.documents?.length>0 && !store?.loading">
                <virtual-scroller #scroll [parentScroll]="scroll.window"
                [enableUnequalChildrenSizes]="45" (vsEnd)="_onScroll($event)"
                    [items]="store?.documents">
                    <table class="as-table-wrapper">
                        <thead #header>
                            <tr>
                                <th class="center">
                                    ល.រ
                                </th>
                                <th class="left">
                                    ស្ថានភាព
                                </th>
                                <th class="left">
                                    ឯកសារ
                                </th>
                                <th class="left">
                                    បច្ចុប្បន្នភាព
                                </th>
                            </tr>
                        </thead>
                        <tbody #container>
                            <tr *ngFor="let item of scroll?.viewPortItems; let i = index">
                                <td class="center" style="width: 64px;">
                                    {{i+1}}
                                </td>
                                <td>
                                    <div class="rows">
                                        <a mat-button mat-icon-button
                                            [routerLink]="['/inbox/preview/' + item?.key + '/' + item?.workplace?.key +'/1/design']">
                                            <mat-icon>launch</mat-icon>
                                        </a>
                                        <div class="dot-status" [ngClass]="item?.doc_status|docStatus"></div>
                                        <strong>{{item?.doc_status?.name}}</strong>
                                    </div>
                                </td>
                                <td>
                                    {{item?.documentNo}} · {{item?.documentTitle}}
                                </td>
                                <td>
                                    {{item?.updated_at?.toDate()|date:'mediumDate'}}
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </virtual-scroller>
            </ng-container>
            <ng-container *ngIf="store?.documents?.length===0 && !store?.loading">
                <div class="empty-block">
                    <div class="center-block-empty">
                        <div class="empty-img">
                            <img src="https://mobilecenter.azureedge.net/generated/img/no-apps-db6363dd644196e2291b243bc210e1b0.svg"
                                alt="empty">
                        </div>
                        <div class="empty-text">
                            <p class="empty-state-title">
                                ពុំមានទិន្នន័យ
                            </p>
                            <p class="empty-state-desc">
                                លោកអ្នកអាចបញ្ចូលទិន្នន័យរបស់អគ្គនាយកដ្ឋានដោយគ្រាន់តែចុចប៊ូតុងបង្កើត
                            </p>
                        </div>
                    </div>
                </div>
            </ng-container>
        </div>
    </div>
</div>
