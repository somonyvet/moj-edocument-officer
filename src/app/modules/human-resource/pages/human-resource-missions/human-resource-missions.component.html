<div class="main-panel">
    <div class="main-l doc-list">
        <div class="doc-in">
            <div class="listing-header">
                <div class="action-item">
                    <h4>បេសកកម្ម</h4>
                    <button mat-icon-button (click)="create()" class="enbutton primary" matTooltip="បង្កើត"
                        matTooltipClass="tooltipClass">
                        <mat-icon>add</mat-icon>
                    </button>
                </div>
                <app-search-filter-box placeholder="ស្វែងរកបេសកកម្ម" (searchValue)="onSearch($event)">
                </app-search-filter-box>
                <nav mat-tab-nav-bar class="fire-tabs">
                    <a mat-tab-link *ngFor="let link of tabs" [routerLink]="link.path" routerLinkActive
                        #rla="routerLinkActive" [active]="rla.isActive">{{link.label}}
                    </a>
                </nav>

            </div>

            <ng-container *ngIf="store?.data?.length>0 && !store?.data?.searching">
                <virtual-scroller #scroll class="doc-ls-items seach-header" [items]="store?.data">
                    <a mat-button class="avatar-vt-item" [ngClass]="{'active': mission?.key === store.activeKey}"
                        [routerLink]="mission.key+'/view'"
                        *ngFor="let mission of scroll.viewPortItems ;let i=index; trackBy: trackByIdx">
                        <div class="avatar">
                            <strong>{{getLocalNumber(i+1)}}</strong>
                        </div>
                        <div class="av-vt-body">
                            <strong>{{mission?.description}}</strong>
                            <div class="rows sub-text">
                                <span>
                                    {{
                                    "ចាប់ពីថ្ងៃទី"+
                                    (mission?.startDate?.toDate()|dateDayKh)
                                    +" ខែ​"+
                                    (mission?.startDate?.toDate()|dateMonthKh)
                                    +" ដល់ ថ្ងៃទី"+
                                    (mission?.endDate?.toDate()|dateDayKh)
                                    +" ខែ​"+
                                    (mission?.endDate?.toDate()|dateMonthKh)
                                    }}
                                </span>
                            </div>
                        </div>
                        <!-- <div class="card-list-action">
                            <i class="material-icons" [matMenuTriggerFor]="menu" matTooltip="ជ្រើស"
                                matTooltipClass="tooltipClass">more_vert</i>
                            <mat-menu #menu="matMenu">
                                <button mat-menu-item type="button" (click)="editmission(mission)">
                                    <mat-icon>edit</mat-icon>
                                    <span>កែប្រែ</span>
                                </button>
                                <button mat-menu-item (click)="deletemission(mission)" type="button">
                                    <mat-icon>delete</mat-icon>
                                    <span>លុប</span>
                                </button>
                            </mat-menu>
                        </div> -->
                    </a>
                </virtual-scroller>
            </ng-container>

            <ng-container *ngIf="store?.searching">
                <div class="doc-ls-items center">
                    <app-spinner></app-spinner>
                </div>
            </ng-container>
            <ng-container *ngIf="store?.empty">
                <div class="doc-ls-items center">
                    <app-empty className="empty-vt" name="ពុំមានម៉ោងធ្វើការទេ" subtitle=""></app-empty>
                </div>
            </ng-container>
        </div>
    </div>
    <div class="main-r">
        <router-outlet></router-outlet>
    </div>
</div>
