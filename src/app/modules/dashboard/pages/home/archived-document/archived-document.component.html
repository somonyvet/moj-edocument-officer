<div class="full-page-container">
  <div class="floating-btn">
    <a mat-button mat-icon-button class="mat-add-new" [matMenuTriggerFor]="menuA">
      <mat-icon class="mat-18">toc</mat-icon>
    </a>
    <mat-menu #menuA="matMenu" xPosition="before" class="cmat-menu-container">
      <div class="cmat-menu-content" *ngIf="workplaces && workplaces.length > 0">
        <div (click)="scroll('archivedDocumentRoot')" class="cmat-menu-item">
          <div class="info infof1">
            <p class="name">
              ឯកសារដើម
            </p>
          </div>
          <span class="material-icons checked">
            check_circle
          </span>
        </div>
        <ng-container *ngFor="let item of workplaces;let i = index;">
          <div (click)="scroll(item?.docKey)" class="cmat-menu-item">
            <div class="info infof1">
              <p class="name">
                {{item?.office?.name}}
              </p>
            </div>

            <span class="material-icons checked" *ngIf="item?.isCompleted">
              check_circle
            </span>
          </div>
        </ng-container>
      </div>
    </mat-menu>
  </div>
  <!-- <div class="header">
      <div class="wrapper">
        <nav mat-tab-nav-bar class="fire-tabs" style="flex:1">
          <a mat-tab-link  [routerLink]="'comments'" routerLinkActive
            #rla1="routerLinkActive" [active]="rla1.isActive">ឯកសារ
          </a>

          <a mat-tab-link  [routerLink]="'attachment'" routerLinkActive
            #rla3="routerLinkActive" [active]="rla3.isActive">ឯកសារភ្ជាប់
          </a>

        </nav>

      </div>
    </div> -->
  <div class="body">
    <app-document-skeleton-loading *ngIf="loading"></app-document-skeleton-loading>

    <div class="doc-sticky-close" *ngIf="!loading">
      <div class="sticky-action-head">
        <div class="wrapper">
          <div class="memo">
            <aside class="special-memo asm-ma m15 cur">
              <ng-container>
                <strong class="name">កំណត់សម្គាល់:</strong>
                <span class="memo" *ngIf="documentStore.headerDocument?.doc_status?.key !== 99">សូមត្រួតពិនិត្យនិង
                  បិទបញ្ចប់ឯកសារ</span>
                <span class="memo" *ngIf="documentStore.headerDocument?.doc_status?.key === 99">ឯកសារបានបិទបញ្ចប់</span>
              </ng-container>
            </aside>
          </div>
          <div></div>
          <div class="action-btn">
            <div class="doc-btn-action" style="margin:0">
              <button [disabled]="!isDocCompleted || documentStore.headerDocument?.doc_status?.key === 99" mat-button
                class="enbutton primary" (click)="completedDoc()">
                បិទបញ្ចប់ឯកសារ
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>

    <router-outlet *ngIf="!loading"></router-outlet>
  </div>
</div>
