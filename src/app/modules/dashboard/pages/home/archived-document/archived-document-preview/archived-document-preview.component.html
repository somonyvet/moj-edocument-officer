<div class="archived-document-preview-page">

  <div class="archived-doc-container" *ngIf="!loading;else docLoadingTemplate">

    <div class="doc-card-department" id="archivedDocumentRoot">
      <div class="name-card">
        <h3>
          ឯកសារដើម
        </h3>
        <div class="action-container">
          <a (click)="print('printArchivedDoc0')" mat-button mat-icon-button class="mat-add-new">
            <mat-icon>print</mat-icon>
          </a>
        </div>
      </div>

      <div class="doc-form-item" style="padding: 0; background-color: transparent!important;" *ngIf="store?.documentParentDoc?.files?.length > 0">
        <h3 style="padding: 0 40px;">-ឯកសារយោង</h3>
        <div class="attachments-wrap" style="padding: 0 40px;" *ngIf="store?.documentParentDoc?.files|checkListFileImg">
          <ng-container *ngFor="let j of store?.documentParentDoc?.files|filterImgFiles">
            <div class="img-box">
              <img [src]="j?.downloadUrl" alt="">
            </div>
          </ng-container>
        </div>
        <div class="attachments-wrap flex-col"  *ngIf="store?.documentParentDoc?.files|checkListFileDoc">
          <ng-container *ngFor="let j of store?.documentParentDoc?.files|filterDocFiles">
            <div class="doc-box" style="margin-left:40px;">
              <a [href]="j?.downloadUrl" target="_blank">{{j?.name}}</a>
            </div>
            <div class="pdf-view-container">
                <pdf-viewer
                [src]="j?.downloadUrl"
                [rotation]="0"
                [original-size]="false"
                [show-all]="true"
                [fit-to-page]="false"
                [zoom]="1"
                [zoom-scale]="'page-width'"
                [stick-to-page]="false"
                [render-text]="true"
                [external-link-target]="'blank'"
                [autoresize]="true"
                [show-borders]="false"
                style="width: 100%; height: 90vh; overflow-x: hidden;"
              ></pdf-viewer>
            </div>
          </ng-container>
        </div>
      </div>

      <app-document-view id="printArchivedDoc0" [headerDocument]="store?.documentParentDoc"
        [docKey]="store?.documentParentDoc?.key||null"></app-document-view>

      <app-more-document-detail-view [headerKey]="store?.documentParentDoc?.key"></app-more-document-detail-view>
    </div>

    <ng-container
      *ngFor="let item of store?.documentByParentDoc|filterDocParent:store?.documentParentDoc?.key;let i = index;">
      <div class="doc-card-department" [id]="item.key">

        <div class="name-card">
          <h3>
            ឯកសារឆ្លើយតប
          </h3>
          <div class="action-container">
            <a (click)="print('printArchivedDepartmentDoc'+i)" mat-button mat-icon-button class="mat-add-new">
              <mat-icon>print</mat-icon>
            </a>
          </div>
        </div>

        <div class="doc-form-item" style="padding: 0; background-color: transparent!important;" *ngIf="item?.files?.length > 0">
          <h3 style="padding: 0 40px;">-ឯកសារយោង</h3>
          <div class="attachments-wrap" style="padding: 0 40px;" *ngIf="item?.files|checkListFileImg">
            <ng-container *ngFor="let j of item?.files|filterImgFiles">
              <div class="img-box">
                <img [src]="j?.downloadUrl" alt="">
              </div>
            </ng-container>
          </div>
          <div class="attachments-wrap flex-col"  *ngIf="item?.files|checkListFileDoc">
            <ng-container *ngFor="let j of item?.files|filterDocFiles">
              <div class="doc-box" style="margin-left:40px;">
                <a [href]="j?.downloadUrl" target="_blank">{{j?.name}}</a>
              </div>
              <div class="pdf-view-container">
                  <pdf-viewer
                  [src]="j?.downloadUrl"
                  [rotation]="0"
                  [original-size]="false"
                  [show-all]="true"
                  [fit-to-page]="false"
                  [zoom]="1"
                  [zoom-scale]="'page-width'"
                  [stick-to-page]="false"
                  [render-text]="true"
                  [external-link-target]="'blank'"
                  [autoresize]="true"
                  [show-borders]="false"
                  style="width: 100%; height: 90vh; overflow-x: hidden;"
                ></pdf-viewer>
              </div>
            </ng-container>
          </div>
        </div>

        <app-document-view [id]="'printArchivedDepartmentDoc'+i" [headerDocument]="item" [docKey]="item?.key||null">
        </app-document-view>
        <app-more-document-detail-view [headerKey]="item?.key"></app-more-document-detail-view>
      </div>

      <div class="doc-card-department"
        *ngFor="let doc of store?.documentByParentDoc|filterDocParent:item?.key;let i = index;">
        <div class="name-card">
          <h3>
            ឯកសារឆ្លើយតប
          </h3>
          <div class="action-container">
            <a (click)="print('printArchivedSubDoc'+i)" mat-button mat-icon-button class="mat-add-new">
              <mat-icon>print</mat-icon>
            </a>
          </div>
        </div>

        <div class="doc-form-item" style="padding: 0; background-color: transparent!important;" *ngIf="doc?.files?.length > 0">
          <h3 style="padding: 0 40px;">-ឯកសារយោង</h3>
          <div class="attachments-wrap" style="padding: 0 40px;" *ngIf="doc?.files|checkListFileImg">
            <ng-container *ngFor="let j of doc?.files|filterImgFiles">
              <div class="img-box">
                <img [src]="j?.downloadUrl" alt="">
              </div>
            </ng-container>
          </div>
          <div class="attachments-wrap flex-col"  *ngIf="doc?.files|checkListFileDoc">
            <ng-container *ngFor="let j of doc?.files|filterDocFiles">
              <div class="doc-box" style="margin-left:40px;">
                <a [href]="j?.downloadUrl" target="_blank">{{j?.name}}</a>
              </div>
              <div class="pdf-view-container">
                  <pdf-viewer
                  [src]="j?.downloadUrl"
                  [rotation]="0"
                  [original-size]="false"
                  [show-all]="true"
                  [fit-to-page]="false"
                  [zoom]="1"
                  [zoom-scale]="'page-width'"
                  [stick-to-page]="false"
                  [render-text]="true"
                  [external-link-target]="'blank'"
                  [autoresize]="true"
                  [show-borders]="false"
                  style="width: 100%; height: 90vh; overflow-x: hidden;"
                ></pdf-viewer>
              </div>
            </ng-container>
          </div>
        </div>

        <app-document-view [id]="'printArchivedSubDoc'+i" [headerDocument]="doc" [docKey]="doc?.key||null">
        </app-document-view>

        <app-more-document-detail-view [headerKey]="doc?.key"></app-more-document-detail-view>
      </div>
    </ng-container>


  </div>

  <ng-template #docLoadingTemplate>
    <app-document-skeleton-loading></app-document-skeleton-loading>
  </ng-template>

</div>
