<div class="pin-box-wrapper" >
    <div class="pin-box-header">
        <h3>ឯកសារបានបិទបញ្ចប់</h3>
    </div>

    <div class="pin-box-content" *ngIf="store?.headerFinalDocuments?.length > 0">
        <div class="pin-box-content-item" *ngFor="let item of store?.headerFinalDocuments" [routerLink]="['/document/' + item?.key]">
            <div class="pin-box-icon">
                <img [src]="item?.coverFile?.downloadURL" alt="">
            </div>
            <div class="pin-box-info">
                <div class="doc-title">
                    {{item?.documentTitle?.length > 35 ?item?.documentTitle.substring(0, 35) + '...':item?.documentTitle}}
                </div>
                <div class="doc-number">
                    {{item?.documentNo?.length > 35 ?item?.documentNo.substring(0, 35) + '...':item?.documentNo}}
                </div>
            </div>
        </div>
    </div>
    <mat-divider></mat-divider>
