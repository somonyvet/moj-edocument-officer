<div class="main-panel">
    <div class="main-l" [ngStyle]="setToggle()">
        <div class="head-bar">
            <button mat-button class="enbutton primary" (click)="_onCreateDoc()">
                <div class="rows">
                    <ion-icon name="create-outline"></ion-icon>
                    <span>New listing</span>
                </div>
            </button>
        </div>
        <div class="main-body">
            <div class="tog-side-nav">
                <a class="side-nav-item" mat-button *ngFor="let item of nav_items" #appTab="routerLinkActive" routerLinkActive="active"
                    [routerLink]="[item?.router]">
                    <ion-icon [name]="item?.icon+(appTab?.isActive?'':'-outline')"></ion-icon>
                    <span>{{item?.name}}</span>
                </a>
            </div>
        </div>
        <div class="main-calendar">
            <mat-divider></mat-divider>
            <mat-calendar (selectedChange)="_onSelectedCalendar($event)" [(selected)]="selected"></mat-calendar>
        </div>
    </div>
    <div class="main-r">
        <router-outlet></router-outlet>
    </div>
</div>
